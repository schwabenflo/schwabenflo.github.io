<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#1b2233;--mut:#6b7488;--pri:#4f6bff;--ok:#22a45d;--okb:#e2f8ea;--no:#e04848;--nob:#fde6e6;--warn:#e69a1c;--wb:#fff3dc;--chip:#eef1ff}
[data-theme=dark]{--bg:#10141f;--card:#1b2130;--tx:#e8ecf5;--mut:#9aa3b8;--chip:#273050;--okb:#173a28;--nob:#3d1d1f;--wb:#3a2f17}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:17px}
header{position:sticky;top:0;background:var(--bg);padding:.7rem 1rem .4rem;z-index:5;max-width:640px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.95rem}
#bar{height:10px;background:#0002;border-radius:6px;overflow:hidden;margin-top:.5rem}#fill{height:100%;background:linear-gradient(90deg,#4f6bff,#22a45d);width:0;transition:width .4s}
#unit{color:var(--mut);font-size:.85rem;margin-top:.35rem}
main{max-width:640px;margin:auto;padding:0 1rem 7rem}
.card{background:var(--card);border-radius:18px;padding:1.2rem;box-shadow:0 4px 18px #0001;animation:pop .25s}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
h2{margin:.1rem 0 .8rem;font-size:1.25rem}.mut{color:var(--mut);font-size:.9rem}
.line{display:flex;gap:.7rem;align-items:flex-start;padding:.6rem;border-radius:12px;background:var(--chip);margin:.5rem 0}
.line b{display:block}.rs{color:var(--mut);font-style:italic;font-size:.88rem;display:block}.de{font-size:.95rem}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:1.25rem;cursor:pointer}
.play.big{width:84px;height:84px;font-size:2.2rem;display:block;margin:.6rem auto}.play.on{background:var(--ok)}
.opt{display:block;width:100%;text-align:left;margin:.45rem 0;padding:.85rem 1rem;border:2px solid #0002;border-radius:14px;background:var(--card);color:var(--tx);font-size:1rem;cursor:pointer;min-height:52px}
.opt.sel{border-color:var(--pri)}.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--nob);border-color:var(--no)}
input[type=text]{font-size:1.05rem;padding:.7rem;border-radius:12px;border:2px solid #0003;background:var(--card);color:var(--tx);width:100%}
.gap input{width:9rem;display:inline-block;margin:0 .3rem}.gap{line-height:2.6;font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;min-height:56px;padding:.5rem;border-radius:12px}.ansz{border:2px dashed #0003;margin:.6rem 0}
.chip{padding:.6rem .8rem;border-radius:12px;border:2px solid #0002;border-bottom-width:4px;background:var(--card);color:var(--tx);font-size:1rem;cursor:pointer}
.chip.used{visibility:hidden}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.mgrid .opt{text-align:center;margin:0}.opt.gone{opacity:.25;pointer-events:none}
.bub{max-width:85%;padding:.6rem .8rem;border-radius:14px;margin:.45rem 0;display:flex;gap:.5rem;align-items:flex-start}
.bub.R{background:var(--chip)}.bub.F{background:var(--okb);margin-left:auto}.bub .play{width:38px;height:38px;font-size:1rem}
.who{font-size:.75rem;color:var(--mut)}
.fb{margin-top:1rem;padding:.8rem 1rem;border-radius:14px;animation:pop .2s}.fb.ok{background:var(--okb)}.fb.near{background:var(--wb)}.fb.no{background:var(--nob)}
.dw{padding:0 .15rem;border-radius:4px}.dw.bad{background:var(--nob);color:var(--no);font-weight:700}.dw.acc{background:var(--wb)}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);padding:.8rem 1rem 1.1rem;box-shadow:0 -2px 12px #0001}
#act{display:block;width:100%;max-width:608px;margin:auto;padding:1rem;font-size:1.1rem;font-weight:700;border:0;border-radius:16px;background:var(--pri);color:#fff;cursor:pointer}
#act:disabled{opacity:.45}.ghost{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:.9rem;cursor:pointer;margin-top:.6rem}
.big{font-size:2.4rem;text-align:center;margin:.3rem 0}.stats{display:flex;justify-content:space-around;text-align:center;margin:1rem 0}.stats b{font-size:1.5rem;display:block}
.mist{padding:.6rem;border-left:4px solid var(--no);background:var(--nob);border-radius:8px;margin:.4rem 0;font-size:.95rem}
.cf{position:fixed;top:-10px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards;z-index:9;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.flame.hot{animation:pulse .5s}@keyframes pulse{50%{transform:scale(1.4)}}

 else if(T==="speak"){v.innerHTML="<h2>🗣️ Laut nachsprechen</h2>"+pb(st.a,1)+"<p style='text-align:center'><b>"+esc(st.fr)+"</b><span class='rs'>("+esc(st.rs)+")</span><span class='de'>"+esc(st.de)+"</span></p><p class='mut' style='text-align:center'>Hör zu, sprich den Satz 2–3 Mal laut nach.</p>";wireplay();
  act("Geschafft 💪",()=>{S.xp+=5;save();next();});}
 else if(T==="listen"||T==="mc"){v.innerHTML=(T==="listen"?"<h2>👂 Hör zu und wähle</h2>"+pb(st.a,1)+"<p class='mut'>Was bedeutet der Satz?</p>":"<h2>✏️ Welche Form passt?</h2><p><b style='font-size:1.15rem'>"+esc(st.q)+"</b><br><span class='mut'>"+esc(st.d)+"</span></p>")+
  st.o.map((o,j)=>"<button class='opt' data-j='"+j+"'>"+(j+1)+") "+esc(o)+"</button>").join("");wireplay();
  X.pick=j=>{if(X.done)return;X.sel=j;document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",+b.dataset.j===j));$("#act").disabled=false;};
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>X.pick(+b.dataset.j));
  act("Prüfen",()=>{X.done=1;const ok=X.sel===st.c;X.got=st.o[X.sel];document.querySelectorAll(".opt").forEach(b=>{const j=+b.dataset.j;if(j===st.c)b.classList.add("right");else if(j===X.sel)b.classList.add("wrong");});
   grade(id,ok?"ok":"no",T==="mc"?st.q+" ("+st.d+")":"Hören",st.o[st.c]+(T==="mc"?" – "+st.q.replace("___",st.o[st.c]):""));fb(ok?"ok":"no",esc(st.e));act("Weiter",next);},1);}
 else if(T==="gap"||T==="tr"){v.innerHTML=T==="gap"?"<h2>⌨️ Lücke füllen</h2><p class='gap'>"+esc(st.pre)+"<input type='text' id='in' autocomplete='off' autocapitalize='off' spellcheck='false'>"+esc(st.post)+"</p><p class='mut'>"+esc(st.d)+"</p><p class='mut'>Tipp: <i>"+esc(st.hint)+"</i></p>"
  :"<h2>🔁 Übersetze ins Französische</h2><p><b style='font-size:1.15rem'>"+esc(st.de)+"</b></p><input type='text' id='in' autocomplete='off' autocapitalize='off' spellcheck='false' placeholder='Auf Französisch …'><p class='mut'>Tipp: <i>"+esc(st.hint)+"</i></p>";
  const inp=$("#in");inp.oninput=()=>{$("#act").disabled=!inp.value.trim();};inp.onkeydown=e=>{if(e.key==="Enter"&&!$("#act").disabled)$("#act").click();};
  act("Prüfen",()=>{const model=T==="gap"?st.pre+" "+st.ans[0]+" "+st.post:st.ans[0];const lvl=check(inp.value,st.ans);inp.disabled=true;X.got=inp.value;
   grade(id,lvl,T==="gap"?st.d:st.de,model.replace(" .","."));fb(lvl,(lvl==="ok"?"":"Richtig: ")+"<b>"+esc(model.replace(" .","."))+"</b>"+(st.e&&lvl!=="ok"?"<br>"+esc(st.e):""));act("Weiter",next);},1);}
 else if(T==="tiles"){const pool=st.w.concat(st.x||[]).map((w,k)=>({w,k}));for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  X.ans=[];v.innerHTML="<h2>🧩 Bau den Satz</h2>"+pb(st.a)+" <span class='mut'>"+esc(st.d)+"</span><div class='chips ansz' id='az'></div><div class='chips' id='bank'>"+pool.map(p=>"<button class='chip' data-k='"+p.k+"'>"+esc(p.w)+"</button>").join("")+"</div>";wireplay();
  const all=st.w.concat(st.x||[]);
  const draw=()=>{$("#az").innerHTML=X.ans.map(k=>"<button class='chip' data-k='"+k+"'>"+esc(all[k])+"</button>").join("");document.querySelectorAll("#bank .chip").forEach(b=>b.classList.toggle("used",X.ans.includes(+b.dataset.k)));
   RZ($("#az"),X.ans,draw,()=>X.done);$("#act").disabled=!X.ans.length;};
  document.querySelectorAll("#bank .chip").forEach(b=>b.onclick=()=>{if(X.done||b.classList.contains("used"))return;X.ans.push(+b.dataset.k);draw();});
  act("Prüfen",()=>{X.done=1;const said=X.ans.map(k=>all[k]).join(" "),want=st.w.join(" ");const ok=norm(said)===norm(want);X.got=said;grade(id,ok?"ok":"no",st.d,want);fb(ok?"ok":"no",(ok?"":"Richtig: ")+"<b>"+esc(want)+"</b>");play(st.a);act("Weiter",next);},1);}
 else if(T==="dict"){v.innerHTML="<h2>🎧 Diktat</h2>"+pb(st.a,1)+"<p class='mut' style='text-align:center'>Hör zu und schreib, was du hörst.</p><input type='text' id='in' autocomplete='off' autocapitalize='off' spellcheck='false'>";wireplay();
  const inp=$("#in");inp.oninput=()=>{$("#act").disabled=!inp.value.trim();};inp.onkeydown=e=>{if(e.key==="Enter"&&!$("#act").disabled)$("#act").click();};
  act("Prüfen",()=>{inp.disabled=true;const lvl=check(inp.value,[st.ans]);X.got=inp.value;grade(id,lvl,"Diktat: "+st.d,st.ans);fb(lvl,diff(inp.value,st.ans)+"<br><span class='mut'>"+esc(st.d)+"</span>");act("Weiter",next);},1);}
 else if(T==="match"){const L=st.pairs.map((p,k)=>({k,s:p[0]})),R=st.pairs.map((p,k)=>({k,s:p[1]}));R.sort(()=>Math.random()-.5);L.sort(()=>Math.random()-.5);X.err=0;X.left=st.pairs.length;
  v.innerHTML="<h2>🔗 Finde die Paare</h2><p class='mut'>Tippe ein französisches und das passende deutsche Wort.</p><div class='mgrid'>"+L.map((l,i)=>"<button class='opt' data-s='L' data-k='"+l.k+"'>"+esc(l.s)+"</button><button class='opt' data-s='R' data-k='"+R[i].k+"'>"+esc(R[i].s)+"</button>").join("")+"</div>";
  act("Prüfen",()=>{},1);
  document.querySelectorAll(".mgrid .opt").forEach(b=>b.onclick=()=>{const side=b.dataset.s;const o=document.querySelector(".mgrid .opt.sel[data-s='"+(side==="L"?"R":"L")+"']");
   document.querySelectorAll(".mgrid .opt.sel[data-s='"+side+"']").forEach(e=>e.classList.remove("sel"));b.classList.add("sel");
   if(o){if(o.dataset.k===b.dataset.k){[o,b].forEach(e=>{e.classList.remove("sel");e.classList.add("right");setTimeout(()=>e.classList.add("gone"),250);});X.left--;
     if(X.left===0){const ok=X.err===0;X.got=X.err+" Fehlversuch(e)";grade(id,ok?"ok":"no","Wortpaare",st.pairs.map(p=>p[0]+" = "+p[1]).join(", "));fb(ok?"ok":"no",ok?"Alle Paare ohne Fehler.":X.err+" Fehlversuch(e). "+esc(st.pairs.map(p=>p[0]+" = "+p[1]).join(" · ")));act("Weiter",next);}}
    else{X.err++;[o,b].forEach(e=>{e.classList.add("wrong");setTimeout(()=>e.classList.remove("wrong","sel"),400);});}}});}
 else if(T==="dialog"){X.t=0;X.bad=[];X.badgot=[];v.innerHTML="<h2>"+esc(st.title)+"</h2><p class='mut'>"+esc(st.pn)+" spricht (🔊). Du antwortest.</p><div id='chat'></div><div id='turn'></div>";dstep(id,st);}
}
function bub(t){return "<div class='bub "+t.w+"'>"+pb(t.a)+"<div><span class='who'>"+(t.w==="R"?esc(D[idx()].pn):"Du")+"</span><br><b>"+esc(t.fr)+"</b><span class='rs'>("+esc(t.rs)+")</span><span class='de'>"+esc(t.de)+"</span></div></div>";}
function dstep(id,st){const ch=$("#chat"),tn=$("#turn");tn.innerHTML="";
 if(X.t>=st.turns.length){const ok=X.bad.length===0;X.got=X.badgot.join(" · ");grade(id,ok?"ok":"no",st.title,X.bad.join(" · ")||"–");
  $("#view").insertAdjacentHTML("beforeend","<h3>Ganzer Dialog</h3>"+st.turns.map(t=>"<div class='line'>"+pb(t.a)+"<div><span class='who'>"+(t.w==="R"?esc(st.pn):"Du")+"</span><b>"+esc(t.fr)+"</b><span class='rs'>("+esc(t.rs)+")</span><span class='de'>"+esc(t.de)+"</span></div></div>").join(""));
  fb(ok?"ok":"no",ok?"Super telefoniert!":"Einige Antworten waren noch nicht richtig.");wireplay();act("Weiter",next);return;}
 const t=st.turns[X.t];
 if(t.w==="R"){ch.insertAdjacentHTML("beforeend",bub(t));wireplay();play(t.a);X.t++;
  act("Antworten",()=>dstep(id,st));return;}
 const done=(lvl,g)=>{if(lvl==="no"){X.bad.push(t.fr);X.badgot.push(g);}if(lvl!=="no"){S.streak++;S.best=Math.max(S.best,S.streak);S.xp+=lvl==="ok"?10:5;bump();}else S.streak=0;save();hud();
  fb(lvl,lvl==="ok"?"":"Richtig: <b>"+esc(t.fr)+"</b>"+(t.e&&lvl==="no"?"<br>"+esc(t.e):""));tn.innerHTML="";ch.insertAdjacentHTML("beforeend",bub(t));wireplay();play(t.a);X.t++;
  act("Weiter",()=>{document.querySelectorAll("#view .fb").forEach(e=>e.remove());dstep(id,st);});};
 if(t.m==="choose"){tn.innerHTML="<p class='mut'>Was sagst du? <i>("+esc(t.de)+")</i></p>"+t.o.map((o,j)=>"<button class='opt' data-j='"+j+"'>"+(j+1)+") "+esc(o)+"</button>").join("");
  X.sel=null;X.pick=j=>{X.sel=j;tn.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",+b.dataset.j===j));$("#act").disabled=false;};
  tn.querySelectorAll(".opt").forEach(b=>b.onclick=()=>X.pick(+b.dataset.j));act("Prüfen",()=>{X.pick=null;done(X.sel===t.c?"ok":"no",t.o[X.sel]);},1);}
 else{tn.innerHTML="<p class='mut'>Sag auf Französisch: <b>"+esc(t.de)+"</b></p><input type='text' id='in' autocomplete='off' autocapitalize='off' spellcheck='false'><p class='mut'>Tipp: <i>"+esc(t.hint)+"</i></p>";
  const inp=$("#in");inp.oninput=()=>{$("#act").disabled=!inp.value.trim();};inp.onkeydown=e=>{if(e.key==="Enter"&&!$("#act").disabled)$("#act").click();};act("Prüfen",()=>done(check(inp.value,t.ans),inp.value),1);}
}
function diff(inp,ans){const A=ans.split(/\s+/),B=norm(inp).split(" ").filter(Boolean);const a=A.map(w=>strip(norm(w))),b=B.map(w=>strip(w));
 const n=a.length,m=b.length,T=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=a[i]===b[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
 let i=0,j=0,out=[];while(i<n){if(j<m&&a[i]===b[j]){out.push("<span class='dw"+(norm(A[i])===B[j]?"":" acc")+"'>"+esc(A[i])+"</span>");i++;j++;}else if(j<m&&T[i][j+1]>=T[i+1][j])j++;else{out.push("<span class='dw bad'>"+esc(A[i])+"</span>");i++;}}
 return "Lösung: "+out.join(" ")+"<br><span class='mut'>Rot = fehlt oder falsch, gelb = Akzent.</span>";}
function summary(){$("#unit").textContent="Fertig!";$("#skip").style.display="none";$("#fill").style.width="100%";
 const gk=Object.keys(S.res),ok=gk.filter(k=>S.res[k]).length;const ms=Object.entries(S.mist);
 $("#view").innerHTML="<div class='big'>🎉</div><h2 style='text-align:center'>"+(S.retry?"Wiederholung geschafft!":"Lektion geschafft!")+"</h2><div class='stats'><div><b>"+ok+"/"+gk.length+"</b>richtig</div><div><b>"+S.xp+"</b>XP</div><div><b>🔥 "+S.best+"</b>beste Serie</div></div>"+
 (ms.length?"<h3>Deine Fehler zum Wiederholen</h3>"+ms.map(([k,m])=>"<div class='mist'><span class='mut'>"+esc(m.p)+"</span><br>✔ <b>"+esc(m.c)+"</b></div>").join("")+"<button class='opt' id='rt' style='text-align:center;font-weight:700'>🔁 Fehler nochmal üben ("+ms.length+")</button>":"<p style='text-align:center'>Keine offenen Fehler. Stark! 💪</p>")+"<button class='opt' id='cp' style='text-align:center;font-weight:700;background:var(--pri);color:#fff'>📋 Ergebnis kopieren</button><div id='cpm' class='mut'></div><textarea id='ta' readonly rows='8' style='display:none;width:100%;font-size:.85rem'></textarea><p class='mut'>Füg das Ergebnis im Chat ein, dann übe ich deine Fehler in den nächsten Lektionen.</p>";
 bindCopy();const rt=$("#rt");if(rt)rt.onclick=()=>{S.retry=[...new Set(ms.map(([k,m])=>m.s))].sort((x,y)=>x-y);S.ri=0;save();render();};
 act("Kurs von vorn",()=>{const keep=S.mist;S=fresh();S.mist={};save();render();});confetti();save();}
function confetti(){const c=["#4f6bff","#22a45d","#e69a1c","#e04848","#b44fff"];for(let i=0;i<70;i++){const d=document.createElement("div");d.className="cf";d.style.left=Math.random()*100+"vw";d.style.background=c[i%5];d.style.animationDuration=(1.5+Math.random()*2)+"s";d.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),4500);}}
function solOf(st){const T=st.t;if(T==="listen"||T==="mc")return st.o[st.c]+(T==="mc"?" – "+st.q.replace("___",st.o[st.c]):"");if(T==="gap")return (st.pre+" "+st.ans[0]+" "+st.post).replace(" .",".");if(T==="tr")return st.ans[0];if(T==="dict")return st.ans;if(T==="tiles")return st.w.join(" ");if(T==="match")return st.pairs.map(p=>p[0]+" = "+p[1]).join(", ");if(T==="dialog")return st.turns.filter(t=>t.w==="F").map(t=>t.fr).join(" · ");return "";}
$("#skip").onclick=()=>{const id=idx(),st=D[id];if(st&&GR.includes(st.t)){const sol=solOf(st);if(!S.retry&&S.res[id]===undefined){S.res[id]=false;S.log[id]={s:"ÜBERSPRUNGEN",soll:sol,ich:""};}S.mist[id]={p:st.de||st.d||st.q||st.title||"Übung",c:sol,s:id};S.streak=0;save();}next();};
function report(){const ids=D.map((st,i)=>i).filter(i=>GR.includes(D[i].t));let ok=0,out=[];ids.forEach((i,n)=>{const L=S.log[i],nm=META.lid+"-"+String(n+1).padStart(2,"0")+" "+TN[D[i].t];
 if(!L){out.push(nm+" OFFEN");return;}if(L.s==="OK")ok++;out.push(nm+" "+L.s+(L.s==="FALSCH"?" | soll: "+L.soll+" | ich: "+L.ich:L.s==="ÜBERSPRUNGEN"?" | soll: "+L.soll:""));});
 const d=new Date(),ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
 return "FR-ERGEBNIS "+META.lid+" "+ds+" Vorrat-"+META.slug+"\nXP "+S.xp+" | "+ok+"/"+ids.length+"\n"+out.join("\n");}
const TN={listen:"Hören",mc:"MC",gap:"Lücke",tiles:"Bausteine",dict:"Diktat",tr:"Übersetzen",match:"Paare",dialog:"Dialog"};
function bindCopy(){const txt=report();$("#ta").value=txt;$("#cp").onclick=async()=>{let done=false;try{await navigator.clipboard.writeText(txt);done=true}catch(_){}
 const ta=$("#ta");if(!done){ta.style.display="block";ta.focus();ta.select();try{done=document.execCommand("copy")}catch(_){}}
 $("#cpm").textContent=done?"✅ Kopiert! Jetzt im Chat einfügen.":"Bitte den Text unten markieren und kopieren.";if(!done)ta.style.display="block";window.__copied=txt;};}
function theme(t){document.documentElement.dataset.theme=t;localStorage.setItem("fr-theme",t);$("#th").textContent=t==="dark"?"☀️":"🌙";}
theme(localStorage.getItem("fr-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));$("#th").onclick=()=>theme(document.documentElement.dataset.theme==="dark"?"light":"dark");
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(/^[1-4]$/.test(e.key)&&X.pick)X.pick(+e.key-1);else if(e.key==="Enter"&&!$("#act").disabled)$("#act").click();});
render();

</script>
