<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Wiederholung · Quattrolingo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quattrolingo">
<meta name="theme-color" content="#4f6bff">
<link rel="stylesheet" href="app.css">
<style>
header .sub{max-width:640px;margin:8px auto 0;font-size:.9rem;opacity:.9}
#bar{height:10px;background:#fff3;border-radius:6px;overflow:hidden;max-width:640px;margin:10px auto 0}
#fill{height:100%;width:0;background:#fff;transition:width .3s}
main{padding-bottom:8rem}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:1.25rem;cursor:pointer}
.play.big{width:72px;height:72px;font-size:1.8rem;display:flex;align-items:center;justify-content:center;margin:0}
.play.on,.slowbtn.on{background:var(--ok);color:#fff}
.playrow{display:flex;gap:.6rem;justify-content:center;align-items:center;flex-wrap:wrap;margin:.6rem 0}
.slowbtn{height:46px;padding:0 14px;border:0;border-radius:16px;background:var(--chip);color:var(--tx);font-size:.95rem;font-weight:700;cursor:pointer}
.line{padding:.6rem;border-radius:12px;background:var(--chip);margin:.5rem 0}
.line b{display:block}.fb{margin-top:1rem;padding:.8rem 1rem;border-radius:14px}
.fb.ok{background:var(--okb)}.fb.hint{background:var(--wb)}.fb.no{background:var(--nob)}.fb.ok2{background:var(--wb)}
.rvc{background:var(--chip);border-radius:14px;padding:.6rem .8rem;margin:1rem 0}.rvc h3{margin:.2rem 0 .5rem}
.mist{padding:.6rem;border-left:4px solid var(--no);background:var(--nob);border-radius:8px;margin:.4rem 0;font-size:.95rem}
.mist.two{border-left-color:var(--warn);background:var(--wb)}
.mist .rs,.mist .de,.mist .mut{display:block}
.stats{display:flex;justify-content:space-around;text-align:center;margin:1rem 0}.stats b{font-size:1.5rem;display:block}
.bigx{font-size:2.4rem;text-align:center}
#actbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);padding:.8rem 1rem 1.1rem;box-shadow:0 -2px 12px #0001;z-index:5}
#act{display:block;width:100%;max-width:608px;margin:auto;padding:1rem;font-size:1.1rem;font-weight:700;border:0;border-radius:16px;background:var(--pri);color:#fff;cursor:pointer}
#act:disabled{opacity:.45}
#skip{display:block;margin:.4rem auto 0;background:none;border:0;color:var(--mut);text-decoration:underline;font-size:.9rem;cursor:pointer}
.opt:disabled{opacity:.55}
#ta{width:100%;font-size:.85rem;border-radius:12px;border:2px solid #0002;background:var(--card);color:var(--tx);padding:.5rem}
.hacts{display:flex;align-items:center;gap:4px}
a.back{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;font-size:1.35rem;font-weight:700;color:inherit}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>🔁 Wiederholung</h1>
    <div class="hacts">
      <a class="ic back" href="index.html" aria-label="Zur Startseite">←</a>
      <button id="th" class="ic" aria-label="Hell/Dunkel">🌙</button>
    </div>
  </div>
  <p class="sub" id="sub">Im Abstand 1 · 3 · 7 Tage</p>
  <div id="bar"><div id="fill"></div></div>
</header>
<main>
  <div class="card" id="view">lädt …</div>
</main>
<div id="actbar">
  <button id="act">Weiter</button>
  <button id="skip" type="button">⏭️ Überspringen</button>
</div>
<script>(function(){var ok=true;try{var t=window.localStorage;t.setItem("_t","1");t.removeItem("_t")}catch(e){ok=false}if(!ok){var m={};var f={getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete k in m?void delete m[k]:undefined},clear:function(){m={}}};f.removeItem=function(k){delete m[k]};try{Object.defineProperty(window,"localStorage",{value:f,configurable:true})}catch(e){window.__ls=f}}})();</script>
<script src="wiederholung.js"></script>
</body>
</html>
