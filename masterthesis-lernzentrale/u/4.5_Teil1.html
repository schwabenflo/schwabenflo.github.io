function GV(rows){return "<table class='gv'><tr><th>Größe</th><th>Wert</th><th>Einheit</th></tr>"+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")+"</table>";}
function GIVEN(rows,gesucht){return "<p><b>Gegeben:</b></p>"+GV(rows)+`<p class='gsucht'><b>Gesucht:</b> ${gesucht}</p>`;}
function STEPS(steps){return "<div class='lsg'><b>Lösungsweg:</b><ol>"+steps.map(s=>`<li>${s}</li>`).join("")+"</ol></div>";}
function EXAMPLE(title,rows,gesucht,steps){return `<div class='rb'><b>${title}</b>`+GIVEN(rows,gesucht)+STEPS(steps)+"</div>";}

function VID(id,title,dur,lang,note){return `<div class='vid'><b>▶ Video (${dur} Min., ${lang}): „${title}“</b><br><small>Benötigt Internet. Lädt erst nach Klick (youtube-nocookie).</small><div id='vidslot'><button class='btn' onclick="loadVid('${id}','${dur}')">Video laden</button></div><small>Falls es eingebettet nicht startet: <a href='https://www.youtube.com/watch?v=${id}' target='_blank' rel='noopener'>direkt auf YouTube öffnen</a>.</small>${note?`<p><b>Kritisch hinschauen:</b> ${note}</p>`:""}</div>`;}
function loadVid(id,dur){const el=document.getElementById('vidslot');
 if(location.protocol==='file:'){el.innerHTML=`<p class='hint'>YouTube spielt eingebettete Videos aus lokal geöffneten Dateien nicht ab. <a class='btn' href='https://www.youtube.com/watch?v=${id}' target='_blank' rel='noopener'>▶ Auf YouTube ansehen (${dur})</a></p>`;return;}
 el.innerHTML=`<iframe width='560' height='315' src='https://www.youtube-nocookie.com/embed/${id}' title='Video' allow='encrypted-media; picture-in-picture' referrerpolicy='strict-origin-when-cross-origin' allowfullscreen></iframe>`;}
function svgSprung(){let s=`<svg viewBox='0 0 480 300' class='dia' role='img' aria-label='Sprungfixe Kosten im Beispielwerk'><title>Sprungfixe Kosten: Treppe je Schicht</title>`;
 s+="<line x1='50' y1='270' x2='460' y2='270' class='ax'/><line x1='50' y1='270' x2='50' y2='15' class='ax'/>";
 const X=v=>50+v*400, Y=m=>270-m*58; const st=[[0,1/3,2],[1/3,2/3,3],[2/3,1,4]];
 st.forEach(([a,b,k],i)=>{s+=`<line x1='${X(a)}' y1='${Y(k)}' x2='${X(b)}' y2='${Y(k)}' class='l1'/>`;if(i)s+=`<line x1='${X(a)}' y1='${Y(st[i-1][2])}' x2='${X(a)}' y2='${Y(k)}' class='l1 dash'/>`;s+=`<text x='${(X(a)+X(b))/2}' y='${Y(k)-8}' class='tc'>${i+1} Schicht${i?"en":""}: ${fmt(k,0)} Mio €</text>`;});
 s+=`<line x1='50' y1='${Y(1)}' x2='450' y2='${Y(1)}' class='l2 dash'/><text x='445' y='${Y(1)+16}' class='tr'>Grundblock 1 Mio € (unabhängig von Schichten)</text>`;
 s+=`<line x1='${X(250/300)}' y1='270' x2='${X(250/300)}' y2='${Y(4)}' class='mk'/><text x='${X(250/300)}' y='288' class='tc'>Ist 250.000</text>`;
 s+="<text x='455' y='262' class='tr'>Stück/Jahr (Kapazität 300.000) →</text><text x='55' y='14' class='tl'>Fixkosten/Jahr</text></svg>";return s;}

k:"Die Matrix setzt einen bestimmbaren Horizont voraus. 4.5.1: Ursache bleibt Nachfrageeinbruch, aber die Dauer ist offen. 4.5.2: Strukturwandel in unterschwelligen Schritten – weder Sprung noch offener Horizont.",
body:`<h3>Abschnitt 1: Zwei Sonderfälle</h3><table><tr><th>Sonderfall</th><th>Was ändert sich?</th></tr><tr><td>4.5.1 offener Horizont</td><td>Nicht die Ursache, sondern das Wissen über die Dauer</td></tr><tr><td>4.5.2 rollierender Wandel</td><td>Viele kleine Schritte statt eines Sprungs (4.2.3)</td></tr></table><p>Jeder Sonderfall bleibt im Bezugsrahmen 4.1–4.4; die Nachfrageunsicherheit ist kein neuer Horizont.</p>${ZC(0)}
<h3>Abschnitt 2: Spielregeln</h3><ul><li>Horizonte nach 4.3 – keine eigenen Fristen in 4.5.</li><li>Mix, Los, Schicht nur <b>Störgrößen</b>, kein eigener Sonderfall.</li><li>Netzregel nur angewendet; Senkung ≠ Transfer; OEE/DLE nur Abgrenzung.</li><li>Sonderfälle führen zum <b>Portfolio als Bewertungsobjekt</b> (4.6). Kein Vollständigkeitsanspruch.</li></ul>${ZC(1)}
<div class='merk'><b>Merksatz:</b> „Offen ist nicht gesprungen – und rollend ist nicht offen.“</div>
<div class='why'><b>Warum wichtig für meine Thesis (UF1, UF5):</b> Zeigt, wo die Typologie ehrlich an ihre Grenze stößt.</div>`,

{id:"s2",t:"2. Unsicherheit ist nicht Downside",
k:"Zweiseitige Unsicherheit geht mit starrerer Kostenstruktur einher (Engpasskosten vermeiden). Variabilisierung passt nur beim Downside-Risiko. Verwechslung führt zu falschen Kapazitätsentscheidungen.",
body:`<h3>Abschnitt 1: Zwei Arten von Risiko</h3><ul><li><b>Nachfrageunsicherheit</b>: Streuung steigt, Erwartungswert bleibt → mehr Kapazität vorhalten.</li><li><b>Downside-Risiko</b>: Erwartungswert sinkt → eher niedrigere Fixkosten.</li><li><b>Kwon</b> (Korea 1982–2015) und <b>Banker/Byzalov/Plehn-Dujowich</b> (Compustat, NBER-CES): höhere Unsicherheit → <b>starrere</b> Kostenstruktur, wegen Engpasskosten.</li></ul>${ZC(0)}
<h3>Abschnitt 2: Chancen-Risiko-Profil und Krise</h3><p>Starre Struktur: hoher Gewinn bei hoher, Verlust bei niedriger Nachfrage – über den DOL sichtbar.</p>${CALCW()}<p>Nach der Asienkrise 1997 schwächte sich der Zusammenhang ab (Fremdkapital, Verlustaversion, Outsourcing, Befristung). Das ist der Übergang in eine andere Ursache, kein Gegenbefund.</p><p><b>Offen:</b> Eine frühere Stelle (2.7) liest Variabilisierung bei Unsicherheit; diese Spannung ist noch nicht entschieden.</p>${ZC(1)}
<div class='merk'><b>Merksatz:</b> „Streuung → halten, Absturz → variabilisieren.“</div>
<div class='why'><b>Warum wichtig für meine Thesis (UF1):</b> Verhindert den Reflex, bei jeder Unsicherheit sofort abzubauen.</div>`,

 $$(".gl").forEach(sp=>{sp.onclick=e=>{e.preventDefault();if(touch&&!sp.classList.contains("open")){$$(".gl.open").forEach(o=>o.classList.remove("open"));sp.classList.add("open");return;}jumpGloss(sp);};
  sp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();e.stopPropagation();jumpGloss(sp);}};});
 $$(".glback").forEach(a=>a.onclick=e=>{e.preventDefault();const b=S.back;if(!b)return;S.back=null;save();go(b.page);const el=document.getElementById(b.ref);if(el){el.scrollIntoView({block:"center"});el.classList.add("hl");}else window.scrollTo(0,b.y||0);});}
// ---- Audio-Geschwindigkeit (einheitenübergreifend gespeichert)
const RATEKEY="thesis-kurse-audio-rate",RATES=[1,1.1,1.2,1.3,1.5];
function getRate(){const r=parseFloat(localStorage.getItem(RATEKEY));return RATES.includes(r)?r:1;}
function enhanceAudio(){$$("audio").forEach(a=>{const r=getRate();a.defaultPlaybackRate=r;a.playbackRate=r;a.onloadedmetadata=()=>{a.playbackRate=getRate();};
 if(a.nextElementSibling&&a.nextElementSibling.classList.contains("rate"))return;
 const w=document.createElement("label");w.className="rate";w.innerHTML="Tempo: <select aria-label='Abspielgeschwindigkeit'>"+RATES.map(x=>`<option value='${x}'${x===r?" selected":""}>${String(x.toFixed(1)).replace(".",",")}×</option>`).join("")+"</select>";
 a.after(w);w.querySelector("select").onchange=e=>{const v=parseFloat(e.target.value);localStorage.setItem(RATEKEY,v);$$("audio").forEach(x=>{x.defaultPlaybackRate=v;x.playbackRate=v;});$$(".rate select").forEach(x=>x.value=String(v));};});}

// ---- Meine Fehler
function txt(h){const d=document.createElement("div");d.innerHTML=String(h);d.querySelectorAll("table.gv").forEach(t=>{t.outerHTML=" ["+[...t.querySelectorAll("tr")].slice(1).map(r=>[...r.cells].map(c=>c.textContent).join(" ")).join("; ")+"] ";});return d.textContent.replace(/\s+/g," ").trim();}
function ansTexts(x,c){const rights=x.type==="match"?shuffle(x.pairs.map(p=>p[1]),hash(x.id)):null;
 switch(x.type){case"mc":case"scen":return[x.o[c.v],x.o[x.c]];
 case"tf":return[c.v?"Richtig":"Falsch",x.c?"Richtig":"Falsch"];
 case"gap":return[(c.v||[]).join(" | "),x.a.map(a=>a[0]).join(" | ")];
 case"match":return[x.pairs.map((p,i)=>p[0]+" → "+((c.sel||{})[i]!=null?rights[c.sel[i]]:"–")).join("; "),x.pairs.map(p=>p[0]+" → "+p[1]).join("; ")];
 case"order":return[(c.v||[]).join(" → "),x.items.join(" → ")];
 case"calc":return[(c.v||"")+" "+x.unit,String(x.a).replace(".",",")+" "+x.unit];
 case"open":return["eigene Antwort (Selbsteinschätzung: nicht erfüllt): "+(c.v||""),x.m];}return["",""];}
function errEntry(x,c){const p=pages[S.page];const [mine,right]=ansTexts(x,c);
 return{id:x.id,lesson:p.t,q:txt(x.q),mine:txt(mine),right:txt(right),expl:txt(x.e||"").slice(0,400),ts:Date.now()};}
function logErr(x,c){S.errs=S.errs||{};S.errs[x.id]=errEntry(x,c);if(S.flags)delete S.flags[x.id];}
function errList(){return Object.values(S.errs||{}).sort((a,b)=>a.ts-b.ts);}
function addErr(id,lesson,q,mine,right,expl){S.errs=S.errs||{};if(S.errs[id])return;S.errs[id]={id,lesson,q:txt(q),mine:txt(mine),right:txt(right),expl:txt(expl||"").slice(0,400),ts:Date.now()};}
function redTopics(){return (D.topics||[]).filter(t=>S.ampel[t]==="r");}
function flagList(){return Object.values(S.flags||{}).sort((a,b)=>a.ts-b.ts);}
function buildPrompt(withFlags){const E=errList(),F=withFlags?flagList():[];
 let t=`Hallo Masterthesis Literatur, ich habe in der Lerneinheit „${D.title}“ folgende Punkte nicht verstanden. Bitte erkläre mir jeden Punkt verständlich, mit Bezug zu meiner Masterthesis, einem kurzen Beispiel und einer Kontrollfrage:\n\n`;
 const RT=redTopics();E.concat(F).forEach((e,i)=>{t+=`${i+1}. [${e.lesson}]${e.conf!=null?" (richtig, aber "+(e.conf===2?"geraten":"unsicher")+")":""}\nFrage: ${e.q}\nMeine Antwort: ${e.mine}\nRichtige Antwort: ${e.right}\nKurzerklärung aus der Einheit: ${e.expl}\n\n`;});
 RT.forEach((tp,i)=>{t+=`${E.length+F.length+i+1}. Thema (Selbsteinschätzung: rot): ${tp}\nBitte erkläre dieses Thema von Grund auf.\n\n`;});return t.trim();}
function errsHTML(){const E=errList(),F=flagList();let h=`<h1>Meine Fehler</h1><p>Alle beim <b>ersten Versuch</b> falsch beantworteten Aufgaben aus „${esc(D.title)}“ (Lektionen und Prüfung). Gespeichert im Browser.</p>`;
 const RT=redTopics();if(RT.length)h+=`<h2>Rote Themen (Ampel)</h2><ul>${RT.map(t=>`<li>🔴 ${esc(t)}</li>`).join("")}</ul>`;
 if(!E.length&&!F.length&&!RT.length)return h+"<div class='fb ok'><b>Keine Fehler</b> – bisher alles beim ersten Versuch richtig. 🎉</div>";
 const row=(e,i)=>`<tr><td>${i+1}</td><td>${esc(e.lesson)}</td><td>${esc(e.q)}</td><td>${esc(e.mine)}</td><td>${esc(e.right)}</td><td>${esc(e.expl)}</td></tr>`;
 const head="<tr><th>#</th><th>Lektion</th><th>Frage</th><th>Meine Antwort</th><th>Richtig</th><th>Kurz erklärt</th></tr>";
 h+=E.length?`<h2 id='errfirst'>Falsch beim ersten Versuch (${E.length})</h2><table class='errt'>${head}${E.map(row).join("")}</table>`:"<div class='fb ok'><b>Keine Fehler</b> beim ersten Versuch.</div>";
 if(F.length)h+=`<h2>Richtig, aber unsicher/geraten (${F.length})</h2><table class='errt'>${head}${F.map(row).join("")}</table>`;
 h+=`<p><label><input type='checkbox' id='withflags' ${F.length?"checked":""}> unsichere/geratene Aufgaben mitkopieren</label></p><button class='btn' id='copyprompt'>📋 Kopieren (Prompt für Erklärung)</button> <span id='copystat' class='hint'></span><button class='btn' id='clearerrs' style='background:#888'>Liste leeren</button><textarea id='promptbox' rows='8' readonly></textarea>`;return h;}
function copyText(t){const fb=()=>{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.remove();return ok?"Fallback":"";};
 if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(()=>"Zwischenablage").catch(()=>fb());return Promise.resolve(fb());}
function bindErrs(){const b=$("#copyprompt");if(!b)return;const box=$("#promptbox");const upd=()=>{box.value=buildPrompt($("#withflags").checked);};upd();$("#withflags").onchange=upd;
 b.onclick=()=>{upd();copyText(box.value).then(m=>{window.__lastCopy={method:m,text:box.value};$("#copystat").textContent=m?"✓ kopiert ("+m+")":"Kopieren nicht möglich – Text unten markieren und mit Strg+C kopieren.";if(!m){box.focus();box.select();}});};
 $("#clearerrs").onclick=()=>{if(confirm("Fehlerliste leeren?")){S.errs={};S.flags={};S.ampel={};save();render();}};}

function AUDX(k,lab){if(typeof AUDIO==="undefined"||!AUDIO[k])return "";return `<div class='aud ${lab==="Einstieg"?"aud-in":"aud-sum"}'><b>🎧 ${lab} zum Anhören (1–2 Min.):</b><audio controls preload='none' src='${AUDIO[k]}'></audio><small>Synthetische Stimme (Text-to-Speech); maßgeblich ist der Text.</small></div>`;}
// ---- Sprungmarken / Weiter, wo ich war
function jumpTargets(){const T=[];pages.forEach((p,i)=>{if(p.type==="lesson"){const l=D.lessons[p.i];T.push({l:l.t,i,sel:""});(l.zc||[]).forEach((z,k)=>T.push({l:`↳ Zwischencheck ${k+1}`,i,sel:`.zc[data-i='${k}']`,sub:1}));T.push({l:"↳ Lernkarten",i,sel:"#lernkarten",sub:1});T.push({l:"↳ Übungen",i,sel:"#uebungen",sub:1});}
 else if(p.type!=="title")T.push({l:p.t,i,sel:""});});return T;}
function midTarget(){const L=pages.map((p,i)=>p.type==="lesson"?i:-1).filter(i=>i>=0);if(L.length>=2)return{i:L[Math.floor(L.length/2)],sel:""};return{i:L[0],sel:"#uebungen"};}
function jumpHTML(){let h="<div class='jump noprint'>";const ls=S.last;
 if(ls&&ls.page>0&&ls.page<pages.length)h+=`<button class='btn' id='resume'>▶ Weiter, wo ich war: ${esc(pages[ls.page].t)}</button> `;
 const m=midTarget();h+=`<button class='btn' id='jmid' style='background:#5a6'>⏩ Zur Mitte (~50 %): ${esc(pages[m.i].t)}${m.sel?" – Übungen":""}</button>`;
 h+="<details open><summary><b>Direkt springen</b></summary><ul class='jl'>"+jumpTargets().map((t,k)=>`<li${t.sub?" class='sub'":""}><a href='#' class='jt' data-k='${k}'>${esc(t.l)}</a></li>`).join("")+"</ul></details></div>";return h;}
function goTo(i,sel,y){go(i);if(sel){const el=$(sel);if(el)el.scrollIntoView({block:"start"});}else if(y)window.scrollTo(0,y);}
function bindJump(){const r=$("#resume");if(r)r.onclick=()=>{const ls=S.last;goTo(ls.page,"",ls.y);};
 const m=$("#jmid");if(m)m.onclick=()=>{const t=midTarget();goTo(t.i,t.sel);};
 const T=jumpTargets();$$(".jt").forEach(a=>a.onclick=e=>{e.preventDefault();const t=T[+a.dataset.k];goTo(t.i,t.sel);});}
// ---- Zwischenchecks
function bindZC(){const p=pages[S.page];if(p.type!=="lesson")return;const l=D.lessons[p.i];$$(".zc").forEach(el=>{const k=+el.dataset.i,z=(l.zc||[])[k];if(!z)return;const id=l.id+"z"+k,c=S.zc[id]||{};
 let h=`<div class='etype'>⚡ Zwischencheck ${k+1}</div><p class='qq'>${z.q}</p>`+z.o.map((o,j)=>`<button class='zo${c.v!=null?(j===z.c?" right":j===c.v?" wrong":""):""}' data-j='${j}'>${esc(o)}</button>`).join("");
 if(c.v!=null)h+=`<div class='fb ${c.v===z.c?"ok":"no"}'><b>${c.v===z.c?"✅ Richtig.":"❌ Nicht ganz."}</b> ${z.e}</div>`;el.innerHTML=h;
 $$(".zo",el).forEach(b=>b.onclick=()=>{if(S.zc[id]&&S.zc[id].v!=null)return;const j=+b.dataset.j;S.zc[id]={v:j};if(j!==z.c)addErr(id,l.t+" (Zwischencheck)",z.q,z.o[j],z.o[z.c],z.e);save();const y=window.scrollY;render();window.scrollTo(0,y);});});}
// ---- Schieberegler-Rechner (Beispielwerk)
function calcVals(x,hold){const shifts=hold?3:Math.max(1,Math.ceil(x/100000));const fix=1000000+shifts*1000000,vk=10*x,ges=fix+vk;return{x,shifts,ausl:Math.round(x/3000),fix,fixSt:x?fix/x:0,ges,gesSt:x?ges/x:0};}
const fE=n=>Math.round(n).toLocaleString("de-DE")+" €",fE2=n=>(Math.round(n*100)/100).toLocaleString("de-DE",{maximumFractionDigits:2})+" €";
function bindCalc(){const w=$(".calcw");if(!w)return;const st=S.calc||{x:250000,hold:false};
 w.innerHTML=`<div class='etype'>🧮 Rechner Beispielwerk (erfundene, runde Zahlen)</div><label>Menge pro Jahr: <b id='cx'></b><br><input type='range' id='cr' min='50000' max='300000' step='10000' value='${st.x}' aria-label='Menge pro Jahr'></label><br><label><input type='checkbox' id='ch' ${st.hold?"checked":""}> kurzfristig: alle 3 Schichten bleiben (noch nicht abgebaut)</label><table class='gv' id='ct'></table><p class='hint'>Variable Kosten 10 €/Stück · Grundblock 1 Mio € · je Schicht 1 Mio € und 100.000 Stück Kapazität · Kapazität 300.000 Stück.</p>`;
 const upd=()=>{const x=+$("#cr").value,hold=$("#ch").checked;S.calc={x,hold};save();const v=calcVals(x,hold);$("#cx").textContent=x.toLocaleString("de-DE")+" Stück";
  $("#ct").innerHTML=`<tr><th>Größe</th><th>Wert</th></tr><tr><td>Auslastung (Menge / 300.000)</td><td>${v.ausl} %</td></tr><tr><td>Schichtbedarf</td><td id='cs'>${v.shifts}</td></tr><tr><td>Fixkosten pro Jahr</td><td id='cf'>${fE(v.fix)}</td></tr><tr><td>Fixkosten je Stück</td><td id='cfs'>${fE2(v.fixSt)}</td></tr><tr><td>Gesamtkosten pro Jahr</td><td id='cg'>${fE(v.ges)}</td></tr><tr><td>Gesamtkosten je Stück</td><td id='cgs'>${fE2(v.gesSt)}</td></tr>`;};
 $("#cr").oninput=upd;$("#ch").onchange=upd;upd();}
// ---- Fehler finden
function ffHTML(){const f=D.ff,s=S.ff;let h=`<h1>Fehler finden</h1><p>${f.intro} Klicke die <b>${f.s.filter(x=>x.err).length}</b> fehlerhaften Sätze an und prüfe dann.</p><div class='fftext'>`+f.s.map((x,i)=>{const sel=(s.sel||[]).includes(i);let cls="ffs"+(sel?" sel":"");if(s.done)cls+=x.err?(sel?" right":" missed"):(sel?" wrong":"");return `<span class='${cls}' data-i='${i}' role='button' tabindex='0'>${x.t}</span> `;}).join("")+"</div>";
 if(!s.done)h+="<button class='btn' id='ffcheck'>Prüfen</button>";else{const ok=f.s.every((x,i)=>x.err===(s.sel||[]).includes(i));h+=`<div class='fb ${ok?"ok":"no"}'><b>${ok?"✅ Alle Fehler gefunden.":"❌ Nicht alle richtig markiert."}</b><ol>`+f.s.map((x,i)=>x.err?`<li><b>Fehler:</b> „${x.t}“<br>➜ ${x.e}</li>`:"").join("")+"</ol></div><button class='btn' id='ffredo'>Nochmal</button>";}return h;}
function bindFF(){if(pages[S.page].type!=="ff")return;const s=S.ff;$$(".ffs").forEach(el=>{const t=()=>{if(s.done)return;const i=+el.dataset.i;s.sel=s.sel||[];s.sel=s.sel.includes(i)?s.sel.filter(v=>v!==i):s.sel.concat(i);save();render();};el.onclick=t;el.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();t();}};});
 const c=$("#ffcheck");if(c)c.onclick=()=>{s.done=true;if(!s.logged){s.logged=true;D.ff.s.forEach((x,i)=>{const sel=(s.sel||[]).includes(i);if(x.err&&!sel)addErr("ff"+i,"Fehler finden",x.t,"nicht als Fehler erkannt","Fehler: "+x.e,x.e);if(!x.err&&sel)addErr("ff"+i,"Fehler finden",x.t,"als Fehler markiert","Dieser Satz ist korrekt.",x.e||"");});}save();render();};
 const r=$("#ffredo");if(r)r.onclick=()=>{S.ff={logged:true};save();render();};}
// ---- Kolloquium-Modus
function kolloHTML(){let h="<h1>Kolloquium-Modus</h1><p>So könnte der Prüfer fragen. Antworte erst laut oder schriftlich, dann aufdecken und selbst einschätzen.</p>";
 D.kollo.forEach((k,i)=>{const c=S.kollo[i]||{};h+=`<div class='exbox kq' data-i='${i}'><div class='etype'>🎓 Prüferfrage ${i+1}</div><p class='qq'>${k.q}</p><textarea class='ka' rows='4' placeholder='Deine Antwort (mind. 20 Zeichen) …' ${c.rev?"disabled":""}>${esc(c.v||"")}</textarea>`;
  if(!c.rev)h+="<button class='btn kr'>Aufdecken</button> <span class='hint km'></span>";else{const hits=k.keys.filter(t=>norm(c.v||"").includes(norm(t)));h+=`<div class='model'><b>Musterantwort:</b> ${k.m}<p>Schlüsselbegriffe: ${k.keys.map(t=>hits.includes(t)?"✅ "+esc(t):"◻️ "+esc(t)).join(" · ")}</p></div>`+(c.self==null?"<p>Wie gut war deine Antwort?</p>"+["gut","teilweise","nicht gewusst"].map((o,j)=>`<button class='opt ks' data-v='${j}'>${o}</button>`).join(""):`<p class='hint'>Selbsteinschätzung: ${["gut","teilweise","nicht gewusst"][c.self]}</p>`);}
  h+="</div>";});return h;}
function bindKollo(){$$(".kq").forEach(b=>{const i=+b.dataset.i,k=D.kollo[i];const r=$(".kr",b);if(r)r.onclick=()=>{const v=$(".ka",b).value;if(v.trim().length<20){$(".km",b).textContent="Erst antworten, dann aufdecken.";return;}S.kollo[i]={v,rev:true};save();const y=scrollY;render();scrollTo(0,y);};
 $$(".ks",b).forEach(s=>s.onclick=()=>{const v=+s.dataset.v;S.kollo[i].self=v;if(v>0)addErr("kollo"+i,"Kolloquium-Modus",k.q,S.kollo[i].v,k.m,"Selbsteinschätzung: "+["gut","teilweise","nicht gewusst"][v]);save();const y=scrollY;render();scrollTo(0,y);});});}
// ---- Ampel
function ampelHTML(){return "<h1>Ampel: Selbsteinschätzung</h1><p>Wie sicher fühlst du dich je Thema? <b>Rote</b> Themen landen in „Meine Fehler“ und im Kopier-Prompt.</p><table class='amp'>"+D.topics.map((t,i)=>`<tr><td>${esc(t)}</td><td>`+[["g","🟢 sicher"],["y","🟡 teils"],["r","🔴 unsicher"]].map(([v,l])=>`<button class='ab${S.ampel[t]===v?" on "+v:""}' data-i='${i}' data-v='${v}'>${l}</button>`).join("")+"</td></tr>").join("")+"</table>";}
function bindAmpel(){$$(".ab").forEach(b=>b.onclick=()=>{S.ampel[D.topics[+b.dataset.i]]=b.dataset.v;save();render();});}
// ---- Spaced Repetition (geteilter Schlüssel über alle Einheiten)
const SRSKEY="thesis-kurse-srs",DAY=864e5,IV={l:3*DAY,m:DAY,s:0};
function srsAll(){return JSON.parse(localStorage.getItem(SRSKEY)||"{}");}
function srsSave(o){localStorage.setItem(SRSKEY,JSON.stringify(o));}
function srsRate(gid,card,v){const o=srsAll();const e=o[gid]||{f:card[0],b:card[1],u:D.code,n:0};e.lvl=v;e.n=(e.n||0)+1;e.due=Date.now()+IV[v];o[gid]=e;srsSave(o);}
function srsBtns(id,c){const e=srsAll()[D.code+"|"+id];return `<div class='srsb' data-id='${id}'>`+[["l","leicht"],["m","mittel"],["s","schwer"]].map(([v,l])=>`<button class='sb${e&&e.lvl===v?" on":""}' data-v='${v}'>${l}</button>`).join("")+"</div>";}
function srsRegister(){const o=srsAll();let ch=0;D.lessons.forEach(l=>l.cards.forEach((c,j)=>{const g=D.code+"|"+l.id+"c"+j;if(!o[g]){o[g]={f:c[0],b:c[1],u:D.code,n:0,due:0};ch=1;}}));if(ch)srsSave(o);}
let SQ=null,SFLIP=false;
function srsQueue(){const o=srsAll(),now=Date.now();const ids=Object.keys(o).filter(k=>(o[k].due||0)<=now);const rank=k=>(o[k].u===D.code?0:1)*10+({s:0,m:1,l:2}[o[k].lvl]??0);return ids.sort((a,b)=>rank(a)-rank(b));}
function srsHTML(){if(!SQ)SQ=srsQueue();const o=srsAll();let h=`<h1>Karten wiederholen</h1><p class='hint'>Gemeinsamer Kartenstapel aller Einheiten (im Browser gespeichert). <b>schwer</b> kommt in dieser Runde nach 2 Karten wieder, <b>mittel</b> morgen, <b>leicht</b> in 3 Tagen. Fällig: <span id='srsn'>${SQ.length}</span>.</p>`;
 if(!SQ.length)return h+"<div class='fb ok'><b>Keine Karten fällig.</b> 🎉</div><button class='btn' id='srsall'>Alle Karten dieser Einheit trotzdem üben</button>";
 const g=SQ[0],e=o[g];h+=`<div class='srscard'><div class='etype'>${esc(e.u)}</div><p class='qq' id='srsf'>${esc(e.f)}</p>`+(SFLIP?`<p class='model' id='srsback'>${esc(e.b)}</p><div>`+[["l","leicht"],["m","mittel"],["s","schwer"]].map(([v,l])=>`<button class='btn sr' data-v='${v}'>${l}</button> `).join("")+"</div>":"<button class='btn' id='srsflip'>Umdrehen (Leertaste)</button>")+"</div>";return h;}
function bindSRS(){$$(".sb").forEach(b=>b.onclick=()=>{const id=b.parentNode.dataset.id;const l=D.lessons.find(l=>id.startsWith(l.id+"c"));const c=l.cards[+id.slice(l.id.length+1)];srsRate(D.code+"|"+id,c,b.dataset.v);$$(".sb",b.parentNode).forEach(x=>x.classList.toggle("on",x===b));});
 if(pages[S.page].type!=="srs"){SQ=null;SFLIP=false;return;}
 const f=$("#srsflip");if(f)f.onclick=()=>{SFLIP=true;render();};
 const al=$("#srsall");if(al)al.onclick=()=>{SQ=Object.keys(srsAll()).filter(k=>k.startsWith(D.code+"|"));render();};
 $$(".sr").forEach(b=>b.onclick=()=>{const g=SQ.shift(),o=srsAll(),e=o[g];srsRate(g,[e.f,e.b],b.dataset.v);if(b.dataset.v==="s")SQ.splice(Math.min(2,SQ.length),0,g);SFLIP=false;render();});}
document.addEventListener("keydown",e=>{if(e.key===" "&&$("#srsflip")&&!/TEXTAREA|INPUT/.test(e.target.tagName)){e.preventDefault();$("#srsflip").click();}});
srsRegister();
render();
