function GV(rows){return "<table class='gv'><tr><th>Größe</th><th>Wert</th><th>Einheit</th></tr>"+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")+"</table>";}
function GIVEN(rows,gesucht){return "<p><b>Gegeben:</b></p>"+GV(rows)+`<p class='gsucht'><b>Gesucht:</b> ${gesucht}</p>`;}
function STEPS(steps){return "<div class='lsg'><b>Lösungsweg:</b><ol>"+steps.map(s=>`<li>${s}</li>`).join("")+"</ol></div>";}
function EXAMPLE(title,rows,gesucht,steps){return `<div class='rb'><b>${title}</b>`+GIVEN(rows,gesucht)+STEPS(steps)+"</div>";}

function VID(id,title,dur,lang,note){return `<div class='vid'><b>▶ Video (${dur} Min., ${lang}): „${title}“</b><br><small>Benötigt Internet. Lädt erst nach Klick (youtube-nocookie).</small><div id='vidslot'><button class='btn' onclick="loadVid('${id}','${dur}')">Video laden</button></div><small>Falls es eingebettet nicht startet: <a href='https://www.youtube.com/watch?v=${id}' target='_blank' rel='noopener'>direkt auf YouTube öffnen</a>.</small>${note?`<p><b>Kritisch hinschauen:</b> ${note}</p>`:""}</div>`;}
function loadVid(id,dur){const el=document.getElementById('vidslot');
 if(location.protocol==='file:'){el.innerHTML=`<p class='hint'>YouTube spielt eingebettete Videos aus lokal geöffneten Dateien nicht ab. <a class='btn' href='https://www.youtube.com/watch?v=${id}' target='_blank' rel='noopener'>▶ Auf YouTube ansehen (${dur})</a></p>`;return;}
 el.innerHTML=`<iframe width='560' height='315' src='https://www.youtube-nocookie.com/embed/${id}' title='Video' allow='encrypted-media; picture-in-picture' referrerpolicy='strict-origin-when-cross-origin' allowfullscreen></iframe>`;}
function svgSprung(){let s=`<svg viewBox='0 0 480 300' class='dia' role='img' aria-label='Sprungfixe Kosten im Beispielwerk'><title>Sprungfixe Kosten: Treppe je Schicht</title>`;
 s+="<line x1='50' y1='270' x2='460' y2='270' class='ax'/><line x1='50' y1='270' x2='50' y2='15' class='ax'/>";
 const X=v=>50+v*400, Y=m=>270-m*58; const st=[[0,1/3,2],[1/3,2/3,3],[2/3,1,4]];
 st.forEach(([a,b,k],i)=>{s+=`<line x1='${X(a)}' y1='${Y(k)}' x2='${X(b)}' y2='${Y(k)}' class='l1'/>`;if(i)s+=`<line x1='${X(a)}' y1='${Y(st[i-1][2])}' x2='${X(a)}' y2='${Y(k)}' class='l1 dash'/>`;s+=`<text x='${(X(a)+X(b))/2}' y='${Y(k)-8}' class='tc'>${i+1} Schicht${i?"en":""}: ${fmt(k,0)} Mio €</text>`;});
 s+=`<line x1='50' y1='${Y(1)}' x2='450' y2='${Y(1)}' class='l2 dash'/><text x='445' y='${Y(1)+16}' class='tr'>Grundblock 1 Mio € (unabhängig von Schichten)</text>`;
 s+=`<line x1='${X(250/300)}' y1='270' x2='${X(250/300)}' y2='${Y(4)}' class='mk'/><text x='${X(250/300)}' y='288' class='tc'>Ist 250.000</text>`;
 s+="<text x='455' y='262' class='tr'>Stück/Jahr (Kapazität 300.000) →</text><text x='55' y='14' class='tl'>Fixkosten/Jahr</text></svg>";return s;}

body:`<h3>Abschnitt 1: A1 – Einteilung offenlegen</h3><ul><li>Fix oder variabel ist keine Eigenschaft der Kostenart, sondern hängt an <b>Bezugsgröße, Zeitraum, Betriebspolitik, Auslastung und Kostenobjekt</b>.</li><li>Beleg: Befragung von 14 Fertigungsunternehmen (Oberholzer/Ziemerink, Südafrika) – Löhne gelten dort eher als fix, wegen strengen Arbeitsrechts. Nicht auf Deutschland übertragbar.</li><li>Vorschlag <b>A10</b> (kein gesetzter Punkt): Fixkosten nach <b>Fristigkeitsgrad</b> der Abbaufähigkeit ausweisen.</li></ul>${ZC(0)}
<h3>Abschnitt 2: A2 und A3</h3><ul><li><b>A2</b>: Ein Mengenrückgang (Auslastung) ist kein Effizienzverlust (Verbrauch). Grundlage: Verbrauchs- vs. Beschäftigungsabweichung (2.3), Nennerfrage (2.5).</li><li><b>A3</b>: Leerkosten nur mit genanntem Maßstab. Buchheit (Laborexperiment): Expliziter Leerkostenbericht verbessert Entscheidungen bei <b>sinkender</b>, kann sie bei <b>steigender</b> Nachfrage verschlechtern.</li></ul>
${EXAMPLE("Rechenbeispiel "+BW,[["Fixkosten","4.000.000","€"],["Istmenge","250.000","Stück"],["Maßstab A: Kapazität","300.000","Stück"],["Maßstab B: Plan","250.000","Stück"]],"Leerkosten je Maßstab",["A: 4 Mio × (1 − 250/300) ≈ <b>666.667 €</b>","B: 4 Mio × (1 − 250/250) = <b>0 €</b>","Ohne genannten Maßstab ist die Zahl wertlos (A3)."])}${ZC(1)}

const KEY="kurs-thesis-"+D.code;

function $(s,r){return (r||document).querySelector(s);} function $$(s,r){return [...(r||document).querySelectorAll(s)];}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h;}
function shuffle(orig,seed){let a=orig.slice();let x=Math.abs(seed)||1;for(let i=a.length-1;i>0;i--){x=(x*1103515245+12345)%2147483648;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]];}
 if(a.length>1&&a.every((v,i)=>v===orig[i]))a.push(a.shift());return a;}
function norm(s){return String(s).toLowerCase().trim().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[\s\-–.]/g,"").replace(/,/g,".");}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j;}return m[a.length][b.length];}
function gapOk(v,alts){const n=norm(v);if(!n)return false;return alts.some(a=>{const t=norm(a);if(n===t)return true;if(/\d/.test(t))return parseFloat(n)===parseFloat(t);const tol=t.length>9?2:t.length>4?1:0;return lev(n,t)<=tol;});}
function parseNum(v){v=String(v).replace(/\s|€|%/g,"").replace(/^−/,"-");let neg=v.startsWith("-");if(neg)v=v.slice(1);if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(v))v=v.replace(/\./g,"");return (neg?-1:1)*parseFloat(v.replace(",","."));}
// ---- set (lesson or exam) state
function setKey(){const p=pages[S.page];return p.type==="exam"?"exam":D.lessons[p.i].id;}
function setList(){const p=pages[S.page];return p.type==="exam"?D.exam:D.lessons[p.i].ex;}
function st(){const k=setKey();if(!S.ex[k])S.ex[k]={queue:setList().map(x=>x.id),pos:0,first:{},requeued:{},cur:null};return S.ex[k];}
function curEx(){const s=st();return s.pos<s.queue.length?ALL[s.queue[s.pos]]:null;}
function exHTML(x,s){const c=s.cur||{};const done=c.done;let h=`<div class='exbox' data-type='${x.type}'><div class='etype'>${TN[x.type]} · Aufgabe ${s.pos+1} von ${s.queue.length}${s.pos>=setList().length?" (Wiederholung)":""}</div><p class='qq'>${x.q}</p>`;
 if(x.type==="mc"||x.type==="scen"){h+=x.o.map((o,j)=>`<button class='opt${done?(j===x.c?" right":j===c.v?" wrong":""):""}' data-v='${j}'>${j+1}) ${esc(o)}</button>`).join("");}
 else if(x.type==="tf"){h+=`<textarea id='just' rows='2' placeholder='Optional: Deine Begründung zuerst notieren …' ${done?"disabled":""}>${esc(c.just||"")}</textarea>`+["Richtig","Falsch"].map((o,j)=>{const val=j===0;return `<button class='opt${done?(val===x.c?" right":val===c.v?" wrong":""):""}' data-v='${j}'>${j+1}) ${o}</button>`}).join("");}
 else if(x.type==="gap"){let i=0;h+="<p class='gaptext'>"+esc(x.text).replace(/\{\{(\d+)\}\}/g,(m,n)=>{const v=(c.v||[])[n]||"";const cls=done?(gapOk(v,x.a[n])?"right":"wrong"):"";return `<input class='gap ${cls}' data-n='${n}' value='${esc(v)}' ${done?"disabled":""} aria-label='Lücke ${+n+1}'>`+(done&&!gapOk(v,x.a[n])?` <span class='sol'>(${esc(x.a[n][0])})</span>`:"")})+"</p>";if(!done)h+="<button class='btn' id='check'>Prüfen (Enter)</button>";}
 else if(x.type==="match"){const rights=shuffle(x.pairs.map(p=>p[1]),hash(x.id));const sel=c.sel||{};h+="<div class='match'><div>"+x.pairs.map((p,i)=>`<button class='ml${c.pick===i?" pick":""}${done?(rights[sel[i]]===p[1]?" right":" wrong"):""}' data-i='${i}'>${esc(p[0])}<span class='to'>${sel[i]!==undefined?"→ "+esc(rights[sel[i]]):""}</span></button>`).join("")+"</div><div>"+rights.map((r,j)=>`<button class='mr${Object.values(sel).includes(j)?" used":""}' data-j='${j}'>${esc(r)}</button>`).join("")+"</div></div>";
  if(done)h+="<p class='sol'>Lösung: "+x.pairs.map(p=>esc(p[0])+" → "+esc(p[1])).join(" · ")+"</p>";else h+="<p class='hint'>Erst links einen Begriff, dann rechts die Beschreibung anklicken. Nochmal klicken zum Ändern.</p><button class='btn' id='check'>Prüfen (Enter)</button>";}
 else if(x.type==="order"){const cur=c.v||shuffle(x.items,hash(x.id));h+="<ol class='order'>"+cur.map((it,i)=>`<li class='${done?(it===x.items[i]?"right":"wrong"):""}'><span>${esc(it)}</span>${done?"":`<button class='up' data-i='${i}' aria-label='nach oben'>↑</button><button class='dn' data-i='${i}' aria-label='nach unten'>↓</button>`}</li>`).join("")+"</ol>";if(done)h+="<p class='sol'>Richtige Reihenfolge: "+x.items.map(esc).join(" → ")+"</p>";else h+="<button class='btn' id='check'>Prüfen (Enter)</button>";}
 else if(x.type==="calc"){h+=`<input id='num' inputmode='decimal' value='${esc(c.v||"")}' ${done?"disabled":""} aria-label='Ergebnis'> ${esc(x.unit)} `+(done?"":"<button class='btn' id='check'>Prüfen (Enter)</button>");}
 else if(x.type==="open"){h+=`<textarea id='ans' rows='5' placeholder='Erkläre es zuerst in eigenen Worten (mind. 20 Zeichen) …' ${c.revealed?"disabled":""}>${esc(c.v||"")}</textarea>`;
  if(!c.revealed)h+="<button class='btn' id='reveal'>Aufdecken: Musterantwort vergleichen</button> <span id='ansmsg' class='hint'></span>";
  else{const hits=x.keys.filter(k=>norm(c.v||"").includes(norm(k)));h+=`<div class='model'><b>Musterantwort:</b> ${esc(x.m)}<p>Schlüsselbegriffe in deiner Antwort: ${x.keys.map(k=>hits.includes(k)?"✅ "+esc(k):"◻️ "+esc(k)).join(" · ")}</p></div>`;
   if(!done)h+="<p>Selbsteinschätzung: Deckt deine Antwort die Kernpunkte ab?</p>"+["Ja, vollständig","Teilweise","Nein"].map((o,j)=>`<button class='opt self' data-v='${j}'>${j+1}) ${o}</button>`).join("");}}
 if(done){h+=`<div class='fb ${c.ok?"ok":"no"}'><b>${c.ok?"✅ Richtig.":"❌ Noch nicht richtig."}</b> `;
  if(x.why)h+="<ul>"+x.why.map((w,j)=>`<li${j===x.c?" class='wr'":""}><b>${j+1})</b> ${esc(w)}</li>`).join("")+"</ul>";
  h+=`<div class='expl'>${x.e||""}</div>`+(!c.ok&&s.requeued[x.id]===s.pos&&setKey()!=="exam"?"<p><i>Diese Aufgabe kommt am Ende der Lektion noch einmal.</i></p>":"")+"</div>";
  h+="<div class='conf'>Wie sicher warst du? "+["sicher","unsicher","geraten"].map((o,j)=>`<button class='cf${c.conf===j?" on":""}' data-c='${j}'>${o}</button>`).join("")+"</div><button class='btn' id='nextex'>Nächste Aufgabe (Enter)</button>";}
 return h+"</div>";}
function finish(ok,extra){const s=st(),x=curEx();s.cur=Object.assign(s.cur||{},extra||{},{done:true,ok});if(!(x.id in s.first)){s.first[x.id]=ok;if(!ok)logErr(x,s.cur);}
 if(!ok&&setKey()!=="exam"&&!(x.id in s.requeued)){s.requeued[x.id]=s.pos;s.queue.push(x.id);}save();render();}
function check(){const x=curEx(),s=st();if(!x||(s.cur&&s.cur.done))return;s.cur=s.cur||{};
 if(x.type==="gap"){const v=$$(".gap").map(i=>i.value);finish(v.every((vv,n)=>gapOk(vv,x.a[n])),{v});}
 else if(x.type==="match"){const sel=s.cur.sel||{};if(Object.keys(sel).length<x.pairs.length){alert("Bitte alle Begriffe zuordnen.");return;}const rights=shuffle(x.pairs.map(p=>p[1]),hash(x.id));finish(x.pairs.every((p,i)=>rights[sel[i]]===p[1]));}
 else if(x.type==="order"){const v=s.cur.v||shuffle(x.items,hash(x.id));finish(v.every((it,i)=>it===x.items[i]),{v});}
 else if(x.type==="calc"){const v=$("#num").value,n=parseNum(v);finish(Math.abs(n-x.a)<=x.tol,{v});}}
function nextEx(){const s=st();s.pos++;s.cur=null;save();render();}
function bindEx(){if(!["lesson","exam"].includes(pages[S.page].type))return;const x=curEx();if(!x)return;const s=st();s.cur=s.cur||{};const c=s.cur;
 $$(".exbox .opt").forEach(b=>b.onclick=()=>pickOpt(+b.dataset.v));
 $$(".ml").forEach(b=>b.onclick=()=>{if(c.done)return;const i=+b.dataset.i;c.sel=c.sel||{};if(c.sel[i]!==undefined&&c.pick===i){delete c.sel[i];}c.pick=i;render();});
 $$(".mr").forEach(b=>b.onclick=()=>{if(c.done||c.pick==null)return;const j=+b.dataset.j;c.sel=c.sel||{};for(const k in c.sel)if(c.sel[k]===j)delete c.sel[k];c.sel[c.pick]=j;
   const nx=x.pairs.findIndex((p,i)=>c.sel[i]===undefined);c.pick=nx<0?null:nx;render();});
 $$(".up,.dn").forEach(b=>b.onclick=()=>{const v=c.v||shuffle(x.items,hash(x.id)),i=+b.dataset.i,j=b.classList.contains("up")?i-1:i+1;if(j<0||j>=v.length)return;[v[i],v[j]]=[v[j],v[i]];c.v=v;render();});

 const rv=$("#reveal");if(rv)rv.onclick=()=>{if($("#ans").value.trim().length<20){$("#ansmsg").textContent="Erst erklären: bitte zuerst mindestens einen Satz in eigenen Worten schreiben.";return;}c.v=$("#ans").value;c.revealed=true;save();render();};
 $$(".cf").forEach(b=>b.onclick=()=>{c.conf=+b.dataset.c;S.conf=S.conf||{};S.conf[x.id]=c.conf;if(c.conf>0&&c.ok&&!(S.errs||{})[x.id]){S.flags=S.flags||{};S.flags[x.id]=Object.assign(errEntry(x,c),{conf:c.conf});}else if(S.flags)delete S.flags[x.id];save();render();});

function pickOpt(v){if(!["lesson","exam"].includes(pages[S.page].type))return;const x=curEx(),s=st();if(!x||(s.cur&&s.cur.done))return;

function bindAmpel(){$$(".ab").forEach(b=>b.onclick=()=>{S.ampel[D.topics[+b.dataset.i]]=b.dataset.v;save();render();});}
// ---- Spaced Repetition (geteilter Schlüssel über alle Einheiten)
const SRSKEY="thesis-kurse-srs",DAY=864e5,IV={l:3*DAY,m:DAY,s:0};
function srsAll(){return JSON.parse(localStorage.getItem(SRSKEY)||"{}");}
function srsSave(o){localStorage.setItem(SRSKEY,JSON.stringify(o));}
function srsRate(gid,card,v){const o=srsAll();const e=o[gid]||{f:card[0],b:card[1],u:D.code,n:0};e.lvl=v;e.n=(e.n||0)+1;e.due=Date.now()+IV[v];o[gid]=e;srsSave(o);}
function srsBtns(id,c){const e=srsAll()[D.code+"|"+id];return `<div class='srsb' data-id='${id}'>`+[["l","leicht"],["m","mittel"],["s","schwer"]].map(([v,l])=>`<button class='sb${e&&e.lvl===v?" on":""}' data-v='${v}'>${l}</button>`).join("")+"</div>";}
function srsRegister(){const o=srsAll();let ch=0;D.lessons.forEach(l=>l.cards.forEach((c,j)=>{const g=D.code+"|"+l.id+"c"+j;if(!o[g]){o[g]={f:c[0],b:c[1],u:D.code,n:0,due:0};ch=1;}}));if(ch)srsSave(o);}
let SQ=null,SFLIP=false;
function srsQueue(){const o=srsAll(),now=Date.now();const ids=Object.keys(o).filter(k=>(o[k].due||0)<=now);const rank=k=>(o[k].u===D.code?0:1)*10+({s:0,m:1,l:2}[o[k].lvl]??0);return ids.sort((a,b)=>rank(a)-rank(b));}
function srsHTML(){if(!SQ)SQ=srsQueue();const o=srsAll();let h=`<h1>Karten wiederholen</h1><p class='hint'>Gemeinsamer Kartenstapel aller Einheiten (im Browser gespeichert). <b>schwer</b> kommt in dieser Runde nach 2 Karten wieder, <b>mittel</b> morgen, <b>leicht</b> in 3 Tagen. Fällig: <span id='srsn'>${SQ.length}</span>.</p>`;
 if(!SQ.length)return h+"<div class='fb ok'><b>Keine Karten fällig.</b> 🎉</div><button class='btn' id='srsall'>Alle Karten dieser Einheit trotzdem üben</button>";
 const g=SQ[0],e=o[g];h+=`<div class='srscard'><div class='etype'>${esc(e.u)}</div><p class='qq' id='srsf'>${esc(e.f)}</p>`+(SFLIP?`<p class='model' id='srsback'>${esc(e.b)}</p><div>`+[["l","leicht"],["m","mittel"],["s","schwer"]].map(([v,l])=>`<button class='btn sr' data-v='${v}'>${l}</button> `).join("")+"</div>":"<button class='btn' id='srsflip'>Umdrehen (Leertaste)</button>")+"</div>";return h;}
function bindSRS(){$$(".sb").forEach(b=>b.onclick=()=>{const id=b.parentNode.dataset.id;const l=D.lessons.find(l=>id.startsWith(l.id+"c"));const c=l.cards[+id.slice(l.id.length+1)];srsRate(D.code+"|"+id,c,b.dataset.v);$$(".sb",b.parentNode).forEach(x=>x.classList.toggle("on",x===b));});
 if(pages[S.page].type!=="srs"){SQ=null;SFLIP=false;return;}
 const f=$("#srsflip");if(f)f.onclick=()=>{SFLIP=true;render();};
 const al=$("#srsall");if(al)al.onclick=()=>{SQ=Object.keys(srsAll()).filter(k=>k.startsWith(D.code+"|"));render();};
 $$(".sr").forEach(b=>b.onclick=()=>{const g=SQ.shift(),o=srsAll(),e=o[g];srsRate(g,[e.f,e.b],b.dataset.v);if(b.dataset.v==="s")SQ.splice(Math.min(2,SQ.length),0,g);SFLIP=false;render();});}
document.addEventListener("keydown",e=>{if(e.key===" "&&$("#srsflip")&&!/TEXTAREA|INPUT/.test(e.target.tagName)){e.preventDefault();$("#srsflip").click();}});
srsRegister();
render();

</script><a href="../index.html" style="position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99999;background:#1f3a8a;color:#fff;padding:10px 14px;border-radius:22px;font:600 15px -apple-system,system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px #0004">&#8592; Übersicht</a></body></html>
