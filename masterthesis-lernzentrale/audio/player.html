<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Audio</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:#f6f7fb;color:#1a1a2e}header{background:#1f3a8a;color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px}header a{color:#fff;font-weight:600;text-decoration:none}h1{font-size:1.15em;margin:8px 0 0}main{padding:12px;max-width:720px;margin:auto}button{display:block;width:100%;text-align:left;padding:16px;margin:8px 0;font-size:1.05em;border:0;border-radius:10px;background:#e8edfb;color:#1f3a8a;font-weight:600}button.on{background:#1f3a8a;color:#fff}button.done{background:#d6f5df;color:#14602c}audio{width:100%;margin:8px 0}.sp{display:flex;gap:6px}.sp button{text-align:center;padding:12px 0;margin:4px 0}#all{text-align:center;background:#fff;margin-top:16px}</style></head>
<body><header><a href="../index.html">← Zur Übersicht</a><h1 id="h">🎧 Lädt…</h1></header><main><audio id="a" controls preload="auto"></audio>
<div class="sp"></div><div id="l"></div><button id="all">⬇ Alles als eine MP3 speichern</button></main>
<script>
var a=document.getElementById("a"),U=new URLSearchParams(location.search).get("u")||"",R=parseFloat(localStorage.getItem("lz_rate")||"1.3"),B=[],D=[],i=-1,sp=document.querySelector(".sp");
["1.0","1.1","1.2","1.3","1.4","1.5"].forEach(function(r){var b=document.createElement("button");b.textContent=r+"x";b.dataset.r=r;b.onclick=function(){sr(parseFloat(r))};sp.appendChild(b)});
function sr(r){R=r;a.playbackRate=r;a.defaultPlaybackRate=r;localStorage.setItem("lz_rate",r);sp.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",parseFloat(b.dataset.r)==r)})}
function dec(t){var b=atob(t),u=new Uint8Array(b.length);for(var j=0;j<b.length;j++)u[j]=b.charCodeAt(j);return u}
function ld(k){a.src=URL.createObjectURL(new Blob([D[k]],{type:"audio/mpeg"}));a.playbackRate=R}
function pl(k){if(k<0||k>=B.length)return;if(i>=0)B[i].classList.remove("on");i=k;B[i].classList.add("on");ld(k);a.play()}
a.onloadedmetadata=a.onplay=function(){a.playbackRate=R};a.onended=function(){B[i].classList.add("done");pl(i+1)};sr(R);
fetch(U+".json").then(function(r){return r.json()}).then(function(J){document.title="Audio "+U;document.getElementById("h").textContent="🎧 "+J.title;
J.items.forEach(function(it,k){D.push(dec(it[1]));var b=document.createElement("button");b.textContent="▶ "+it[0];b.onclick=function(){pl(k)};document.getElementById("l").appendChild(b);B.push(b)});
if(B.length){i=0;B[0].classList.add("on");ld(0)}}).catch(function(){document.getElementById("h").textContent="Audio nicht gefunden"});
document.getElementById("all").onclick=function(){var x=document.createElement("a");x.href=URL.createObjectURL(new Blob(D,{type:"audio/mpeg"}));x.download=U+"_komplett.mp3";document.body.appendChild(x);x.click()};
</script></body></html>
