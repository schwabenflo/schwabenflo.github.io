// Gemeinsame Helfer für Thesis-Einheiten
function GV(rows){return "<table class='gv'><tr><th>Größe</th><th>Wert</th><th>Einheit</th></tr>"+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")+"</table>";}
function GIVEN(rows,gesucht){return "<p><b>Gegeben:</b></p>"+GV(rows)+`<p class='gsucht'><b>Gesucht:</b> ${gesucht}</p>`;}
function STEPS(steps){return "<div class='lsg'><b>Lösungsweg:</b><ol>"+steps.map(s=>`<li>${s}</li>`).join("")+"</ol></div>";}
function EXAMPLE(title,rows,gesucht,steps){return `<div class='rb'><b>${title}</b>`+GIVEN(rows,gesucht)+STEPS(steps)+"</div>";}

const ZC=i=>`<div class='zc exbox' data-i='${i}'></div>`;
const CALCW=()=>"<div class='calcw exbox'></div>";

const BWT=GV([["Kapazität je Schicht","100.000","Stück/Jahr"],["Schichten (Ist)","3","Schichten"],["Kapazität gesamt","300.000","Stück/Jahr"],["Grundblock Fixkosten","1","Mio €/Jahr"],["Fixkosten je Schicht","1","Mio €/Jahr"],["Variable Kosten","10","€/Stück"],["Istmenge","250.000","Stück/Jahr"]]);
const NT="<span class='nt'>Beispiel (nicht aus der Thesis)</span>";
function VID(id,title,dur,lang,note){return `<div class='vid'><b>▶ Video (${dur} Min., ${lang}): „${title}“</b><br><small>Benötigt Internet. Lädt erst nach Klick (youtube-nocookie).</small><div id='vidslot'><button class='btn' onclick="loadVid('${id}','${dur}')">Video laden</button></div><small>Falls es eingebettet nicht startet: <a href='https://www.youtube.com/watch?v=${id}' target='_blank' rel='noopener'>direkt auf YouTube öffnen</a>.</small>${note?`<p><b>Kritisch hinschauen:</b> ${note}</p>`:""}</div>`;}
function loadVid(id,dur){const el=document.getElementById('vidslot');
 if(location.protocol==='file:'){el.innerHTML=`<p class='hint'>YouTube spielt eingebettete Videos aus lokal geöffneten Dateien nicht ab. <a class='btn' href='https://www.youtube.com/watch?v=${id}' target='_blank' rel='noopener'>▶ Auf YouTube ansehen (${dur})</a></p>`;return;}
 el.innerHTML=`<iframe width='560' height='315' src='https://www.youtube-nocookie.com/embed/${id}' title='Video' allow='encrypted-media; picture-in-picture' referrerpolicy='strict-origin-when-cross-origin' allowfullscreen></iframe>`;}
function svgSprung(){let s=`<svg viewBox='0 0 480 300' class='dia' role='img' aria-label='Sprungfixe Kosten im Beispielwerk'><title>Sprungfixe Kosten: Treppe je Schicht</title>`;
 s+="<line x1='50' y1='270' x2='460' y2='270' class='ax'/><line x1='50' y1='270' x2='50' y2='15' class='ax'/>";
 const X=v=>50+v*400, Y=m=>270-m*58; const st=[[0,1/3,2],[1/3,2/3,3],[2/3,1,4]];
 st.forEach(([a,b,k],i)=>{s+=`<line x1='${X(a)}' y1='${Y(k)}' x2='${X(b)}' y2='${Y(k)}' class='l1'/>`;if(i)s+=`<line x1='${X(a)}' y1='${Y(st[i-1][2])}' x2='${X(a)}' y2='${Y(k)}' class='l1 dash'/>`;s+=`<text x='${(X(a)+X(b))/2}' y='${Y(k)-8}' class='tc'>${i+1} Schicht${i?"en":""}: ${fmt(k,0)} Mio €</text>`;});
 s+=`<line x1='50' y1='${Y(1)}' x2='450' y2='${Y(1)}' class='l2 dash'/><text x='445' y='${Y(1)+16}' class='tr'>Grundblock 1 Mio € (unabhängig von Schichten)</text>`;
 s+=`<line x1='${X(250/300)}' y1='270' x2='${X(250/300)}' y2='${Y(4)}' class='mk'/><text x='${X(250/300)}' y='288' class='tc'>Ist 250.000</text>`;
 s+="<text x='455' y='262' class='tr'>Stück/Jahr (Kapazität 300.000) →</text><text x='55' y='14' class='tl'>Fixkosten/Jahr</text></svg>";return s;}
const fmt=(n,d)=>n.toFixed(d===undefined?2:d).replace(".",",");

title:"4.2 Teil 1: Drei Ursachen von Volumenschwankungen im Überblick",
intro:`<p>Ca. 5 Minuten. Die erste Achse der Typologie: Woher kommt die Volumenänderung? Drei Ursachen als Arbeitsraster – ohne Vollständigkeitsanspruch.</p><div class='bw'><b>${BW}</b>${BWT}</div>`,

{term:"Strukturbruch",def:"Dauerhafte Verschiebung von Volumen oder Maschinen, nicht vorübergehender Rückgang (4.2.3).",src:"4.2"},

lessons:[
{id:"u1",t:"1. Drei Ursachen – drei Seiten",
k:"Nachfrageeinbruch: Menge fehlt. Kapazitätsengpass: wirksame Kapazität fehlt. Strukturbruch: dauerhafte Verschiebung. Ein Arbeitsraster, kein vollständiges Verzeichnis.",
body:`<h3>Abschnitt 1: Die drei Idealtypen</h3><table><tr><th>Ursache</th><th>Was fehlt / ändert sich?</th><th>Dauer</th></tr><tr><td>Nachfrageeinbruch</td><td>Menge &lt; Kapazität</td><td>vorübergehend bis unbestimmt</td></tr><tr><td>Kapazitätsengpass</td><td>Kapazität &lt; Menge</td><td>nach erwarteter Dauer</td></tr><tr><td>Strukturbruch</td><td>Volumen/Maschinen verschoben</td><td>dauerhaft</td></tr></table>
<p>Ein Nachfrageeinbruch ist zu wenig Menge, ein Kapazitätsengpass zu wenig wirksame Kapazität, ein Strukturbruch eine dauerhafte Verschiebung.</p>
${EXAMPLE("Rechenbeispiel "+BW,[["Kapazität","300.000","Stück"],["Menge Fall A","150.000","Stück"],["Menge Fall B","350.000","Stück"]],"Welche Seite fehlt?",["A: 150.000 &lt; 300.000 → <b>Menge fehlt</b> (Nachfrageeinbruch)","B: 350.000 &gt; 300.000 → <b>Kapazität fehlt</b> (Engpass, 50.000 Stück)"])}${ZC(0)}
<h3>Abschnitt 2: Arbeitsraster ohne Vollständigkeit</h3><ul><li>Die drei Ursachen erfüllen die Anforderungen aus 4.1: Exklusivität angestrebt, <b>keine Vollständigkeit</b>, Idealtypen.</li><li>Jede Ursache entfaltet ihre Fixkostenwirkung je nach <b>Zeithorizont</b> (4.3) – in 4.2 keine Monatsschnitte.</li></ul>${ZC(1)}
<div class='merk'><b>Merksatz:</b> „Menge fehlt – Kapazität fehlt – Struktur verschiebt sich.“</div>
<div class='why'><b>Warum wichtig für meine Thesis (UF1):</b> Ursache ist die erste Achse der Matrix (4.4).</div>`,
zc:[{q:"Menge 320.000, Kapazität 300.000. Welche Ursache?",o:["Nachfrageeinbruch","Kapazitätsengpass","Strukturbruch"],c:1,e:"Kapazität fehlt."},
 {q:"Legt 4.2 Monatsschnitte fest?",o:["Ja","Nein – das macht 4.3"],c:1,e:"Horizonte in 4.3."}],
cards:[["Nachfrageeinbruch","Menge < Kapazität."],["Kapazitätsengpass","Wirksame Kapazität < Menge."],["Strukturbruch","Dauerhafte Verschiebung von Volumen/Maschinen."]],

{id:"u1a",type:"calc",q:`${BW}${GIVEN([["Kapazität","300.000","Stück"],["Nachfrage","360.000","Stück"]],"Fehlende Kapazität (Stück)")}`,a:60000,tol:0,unit:"Stück",e:STEPS(["360.000 − 300.000 = <b>60.000 Stück</b> → Engpass"])},
{id:"u1b",type:"match",q:"Ordne Fall und Ursache zu.",pairs:[["Aufträge brechen für sechs Monate ein","Nachfrageeinbruch"],["Nachfrage übersteigt die Linie","Kapazitätsengpass"],["Produkt wird dauerhaft an anderen Standort verlegt","Strukturbruch"]],e:"Drei Seiten."},
{id:"u1c",type:"open",q:"Erkläre, warum die drei Ursachen kein vollständiges Verzeichnis sind und warum das kein Fehler ist.",m:"Es sind Idealtypen als Arbeitsraster; reale Fälle sind Mischformen. Vollständigkeit wird bewusst nicht beansprucht und offengelegt, Abweichungen fangen die Sonderfälle in 4.5 auf.",keys:["Idealtypen","Arbeitsraster","Sonderfälle"],e:"4.1."}]},
{id:"u2",t:"2. Abgrenzungen: Störgrößen und Verlagerung",
k:"Mix, Losgröße und Schichtmodell sind nur nicht gemessene Störgrößen, keine vierte Ursache. Eine Verlagerung kann im abgebenden Werk wie ein Einbruch und im aufnehmenden wie ein Engpass aussehen – sie bleibt eine Ursache.",
body:`<h3>Abschnitt 1: Was keine Ursache ist</h3><ul><li><b>Mix, Losgröße, Schichtmodell</b>: nur Störgrößen (Festlegung 06.10.2026), keine vierte Ursache.</li><li><b>Saisonalität</b>: kein viertes Kernszenario (planbar).</li><li><b>OEE/DLE</b>: nur Abgrenzung (2.5).</li><li>Abweichende Fälle: <b>Sonderfälle in 4.5</b>.</li></ul>${ZC(0)}
<h3>Abschnitt 2: Eine Verlagerung, zwei Gesichter</h3>
${EXAMPLE("Rechenbeispiel ("+NT+")",[["Werk X vorher","250.000","Stück (Kap. 300.000)"],["Werk Y vorher","100.000","Stück (Kap. 100.000)"],["Verlagert","80.000","Stück von X nach Y"]],"Wie sieht es je Werk aus?",["X: 170.000 / 300.000 = 57 % → wirkt wie <b>Einbruch</b>","Y: Bedarf 180.000 &gt; Kap. 100.000 → wirkt wie <b>Engpass</b>","Netz: Menge unverändert 350.000 → <b>eine</b> Ursache: Verlagerung (Strukturbruch)"])}
<ul><li>Volumenabgabe und Maschinenabgabe <b>getrennt</b> betrachten.</li></ul>${ZC(1)}
<div class='merk'><b>Merksatz:</b> „Ein Ereignis, zwei Werke – trotzdem eine Ursache.“</div>
<div class='why'><b>Warum wichtig für meine Thesis (UF1, UF3):</b> Ohne diese Regel würde eine Verlagerung doppelt gezählt.</div>`,

 {q:"Netzmenge bleibt gleich, Volumen wandert. Wie viele Ursachen?",o:["Zwei (Einbruch + Engpass)","Eine"],c:1,e:"Verlagerung bleibt eine Ursache."}],
