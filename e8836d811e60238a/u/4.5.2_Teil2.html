// Gemeinsame Helfer für Thesis-Einheiten
function GV(rows){return "<table class='gv'><tr><th>Größe</th><th>Wert</th><th>Einheit</th></tr>"+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")+"</table>";}
function GIVEN(rows,gesucht){return "<p><b>Gegeben:</b></p>"+GV(rows)+`<p class='gsucht'><b>Gesucht:</b> ${gesucht}</p>`;}
function STEPS(steps){return "<div class='lsg'><b>Lösungsweg:</b><ol>"+steps.map(s=>`<li>${s}</li>`).join("")+"</ol></div>";}
function EXAMPLE(title,rows,gesucht,steps){return `<div class='rb'><b>${title}</b>`+GIVEN(rows,gesucht)+STEPS(steps)+"</div>";}

const ZC=i=>`<div class='zc exbox' data-i='${i}'></div>`;
const CALCW=()=>"<div class='calcw exbox'></div>";

const BWT=GV([["Kapazität je Schicht","100.000","Stück/Jahr"],["Schichten (Ist)","3","Schichten"],["Kapazität gesamt","300.000","Stück/Jahr"],["Grundblock Fixkosten","1","Mio €/Jahr"],["Fixkosten je Schicht","1","Mio €/Jahr"],["Variable Kosten","10","€/Stück"],["Istmenge","250.000","Stück/Jahr"]]);

function VID(id,title,dur,lang,note){return `<div class='vid'><b>▶ Video (${dur} Min., ${lang}): „${title}“</b><br><small>Benötigt Internet. Lädt erst nach Klick (youtube-nocookie).</small><div id='vidslot'><button class='btn' onclick="loadVid('${id}','${dur}')">Video laden</button></div><small>Falls es eingebettet nicht startet: <a href='https://www.youtube.com/watch?v=${id}' target='_blank' rel='noopener'>direkt auf YouTube öffnen</a>.</small>${note?`<p><b>Kritisch hinschauen:</b> ${note}</p>`:""}</div>`;}
function loadVid(id,dur){const el=document.getElementById('vidslot');
 if(location.protocol==='file:'){el.innerHTML=`<p class='hint'>YouTube spielt eingebettete Videos aus lokal geöffneten Dateien nicht ab. <a class='btn' href='https://www.youtube.com/watch?v=${id}' target='_blank' rel='noopener'>▶ Auf YouTube ansehen (${dur})</a></p>`;return;}
 el.innerHTML=`<iframe width='560' height='315' src='https://www.youtube-nocookie.com/embed/${id}' title='Video' allow='encrypted-media; picture-in-picture' referrerpolicy='strict-origin-when-cross-origin' allowfullscreen></iframe>`;}
function svgSprung(){let s=`<svg viewBox='0 0 480 300' class='dia' role='img' aria-label='Sprungfixe Kosten im Beispielwerk'><title>Sprungfixe Kosten: Treppe je Schicht</title>`;
 s+="<line x1='50' y1='270' x2='460' y2='270' class='ax'/><line x1='50' y1='270' x2='50' y2='15' class='ax'/>";
 const X=v=>50+v*400, Y=m=>270-m*58; const st=[[0,1/3,2],[1/3,2/3,3],[2/3,1,4]];

body:`<h3>Abschnitt 1: Drei Latenzen</h3><ol><li>bis die Änderung wahrgenommen wird</li><li>bis Handlungsbedarf erkannt wird</li><li>Planungslatenz: Information, Analyse, Entscheidung, Umsetzung</li></ol><p>Anpassungsfähigkeit senkt oft die durchschnittliche Auslastung. Dass der Footprint nachläuft, ist <b>Übertragung der Arbeit</b>, keine Monatsfrist.</p>${ZC(0)}

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j;}return m[a.length][b.length];}

function ffHTML(){const f=D.ff,s=S.ff;let h=`<h1>Fehler finden</h1><p>${f.intro} Klicke die <b>${f.s.filter(x=>x.err).length}</b> fehlerhaften Sätze an und prüfe dann.</p><div class='fftext'>`+f.s.map((x,i)=>{const sel=(s.sel||[]).includes(i);let cls="ffs"+(sel?" sel":"");if(s.done)cls+=x.err?(sel?" right":" missed"):(sel?" wrong":"");return `<span class='${cls}' data-i='${i}' role='button' tabindex='0'>${x.t}</span> `;}).join("")+"</div>";
 if(!s.done)h+="<button class='btn' id='ffcheck'>Prüfen</button>";else{const ok=f.s.every((x,i)=>x.err===(s.sel||[]).includes(i));h+=`<div class='fb ${ok?"ok":"no"}'><b>${ok?"✅ Alle Fehler gefunden.":"❌ Nicht alle richtig markiert."}</b><ol>`+f.s.map((x,i)=>x.err?`<li><b>Fehler:</b> „${x.t}“<br>➜ ${x.e}</li>`:"").join("")+"</ol></div><button class='btn' id='ffredo'>Nochmal</button>";}return h;}
function bindFF(){if(pages[S.page].type!=="ff")return;const s=S.ff;$$(".ffs").forEach(el=>{const t=()=>{if(s.done)return;const i=+el.dataset.i;s.sel=s.sel||[];s.sel=s.sel.includes(i)?s.sel.filter(v=>v!==i):s.sel.concat(i);save();render();};el.onclick=t;el.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();t();}};});
 const c=$("#ffcheck");if(c)c.onclick=()=>{s.done=true;if(!s.logged){s.logged=true;D.ff.s.forEach((x,i)=>{const sel=(s.sel||[]).includes(i);if(x.err&&!sel)addErr("ff"+i,"Fehler finden",x.t,"nicht als Fehler erkannt","Fehler: "+x.e,x.e);if(!x.err&&sel)addErr("ff"+i,"Fehler finden",x.t,"als Fehler markiert","Dieser Satz ist korrekt.",x.e||"");});}save();render();};
 const r=$("#ffredo");if(r)r.onclick=()=>{S.ff={logged:true};save();render();};}
// ---- Kolloquium-Modus
function kolloHTML(){let h="<h1>Kolloquium-Modus</h1><p>So könnte der Prüfer fragen. Antworte erst laut oder schriftlich, dann aufdecken und selbst einschätzen.</p>";
 D.kollo.forEach((k,i)=>{const c=S.kollo[i]||{};h+=`<div class='exbox kq' data-i='${i}'><div class='etype'>🎓 Prüferfrage ${i+1}</div><p class='qq'>${k.q}</p><textarea class='ka' rows='4' placeholder='Deine Antwort (mind. 20 Zeichen) …' ${c.rev?"disabled":""}>${esc(c.v||"")}</textarea>`;
  if(!c.rev)h+="<button class='btn kr'>Aufdecken</button> <span class='hint km'></span>";else{const hits=k.keys.filter(t=>norm(c.v||"").includes(norm(t)));h+=`<div class='model'><b>Musterantwort:</b> ${k.m}<p>Schlüsselbegriffe: ${k.keys.map(t=>hits.includes(t)?"✅ "+esc(t):"◻️ "+esc(t)).join(" · ")}</p></div>`+(c.self==null?"<p>Wie gut war deine Antwort?</p>"+["gut","teilweise","nicht gewusst"].map((o,j)=>`<button class='opt ks' data-v='${j}'>${o}</button>`).join(""):`<p class='hint'>Selbsteinschätzung: ${["gut","teilweise","nicht gewusst"][c.self]}</p>`);}
  h+="</div>";});return h;}
function bindKollo(){$$(".kq").forEach(b=>{const i=+b.dataset.i,k=D.kollo[i];const r=$(".kr",b);if(r)r.onclick=()=>{const v=$(".ka",b).value;if(v.trim().length<20){$(".km",b).textContent="Erst antworten, dann aufdecken.";return;}S.kollo[i]={v,rev:true};save();const y=scrollY;render();scrollTo(0,y);};
 $$(".ks",b).forEach(s=>s.onclick=()=>{const v=+s.dataset.v;S.kollo[i].self=v;if(v>0)addErr("kollo"+i,"Kolloquium-Modus",k.q,S.kollo[i].v,k.m,"Selbsteinschätzung: "+["gut","teilweise","nicht gewusst"][v]);save();const y=scrollY;render();scrollTo(0,y);});});}
// ---- Ampel
function ampelHTML(){return "<h1>Ampel: Selbsteinschätzung</h1><p>Wie sicher fühlst du dich je Thema? <b>Rote</b> Themen landen in „Meine Fehler“ und im Kopier-Prompt.</p><table class='amp'>"+D.topics.map((t,i)=>`<tr><td>${esc(t)}</td><td>`+[["g","🟢 sicher"],["y","🟡 teils"],["r","🔴 unsicher"]].map(([v,l])=>`<button class='ab${S.ampel[t]===v?" on "+v:""}' data-i='${i}' data-v='${v}'>${l}</button>`).join("")+"</td></tr>").join("")+"</table>";}
function bindAmpel(){$$(".ab").forEach(b=>b.onclick=()=>{S.ampel[D.topics[+b.dataset.i]]=b.dataset.v;save();render();});}
// ---- Spaced Repetition (geteilter Schlüssel über alle Einheiten)
const SRSKEY="thesis-kurse-srs",DAY=864e5,IV={l:3*DAY,m:DAY,s:0};
function srsAll(){return JSON.parse(localStorage.getItem(SRSKEY)||"{}");}
function srsSave(o){localStorage.setItem(SRSKEY,JSON.stringify(o));}
function srsRate(gid,card,v){const o=srsAll();const e=o[gid]||{f:card[0],b:card[1],u:D.code,n:0};e.lvl=v;e.n=(e.n||0)+1;e.due=Date.now()+IV[v];o[gid]=e;srsSave(o);}
function srsBtns(id,c){const e=srsAll()[D.code+"|"+id];return `<div class='srsb' data-id='${id}'>`+[["l","leicht"],["m","mittel"],["s","schwer"]].map(([v,l])=>`<button class='sb${e&&e.lvl===v?" on":""}' data-v='${v}'>${l}</button>`).join("")+"</div>";}
function srsRegister(){const o=srsAll();let ch=0;D.lessons.forEach(l=>l.cards.forEach((c,j)=>{const g=D.code+"|"+l.id+"c"+j;if(!o[g]){o[g]={f:c[0],b:c[1],u:D.code,n:0,due:0};ch=1;}}));if(ch)srsSave(o);}
let SQ=null,SFLIP=false;
function srsQueue(){const o=srsAll(),now=Date.now();const ids=Object.keys(o).filter(k=>(o[k].due||0)<=now);const rank=k=>(o[k].u===D.code?0:1)*10+({s:0,m:1,l:2}[o[k].lvl]??0);return ids.sort((a,b)=>rank(a)-rank(b));}
function srsHTML(){if(!SQ)SQ=srsQueue();const o=srsAll();let h=`<h1>Karten wiederholen</h1><p class='hint'>Gemeinsamer Kartenstapel aller Einheiten (im Browser gespeichert). <b>schwer</b> kommt in dieser Runde nach 2 Karten wieder, <b>mittel</b> morgen, <b>leicht</b> in 3 Tagen. Fällig: <span id='srsn'>${SQ.length}</span>.</p>`;
 if(!SQ.length)return h+"<div class='fb ok'><b>Keine Karten fällig.</b> 🎉</div><button class='btn' id='srsall'>Alle Karten dieser Einheit trotzdem üben</button>";
 const g=SQ[0],e=o[g];h+=`<div class='srscard'><div class='etype'>${esc(e.u)}</div><p class='qq' id='srsf'>${esc(e.f)}</p>`+(SFLIP?`<p class='model' id='srsback'>${esc(e.b)}</p><div>`+[["l","leicht"],["m","mittel"],["s","schwer"]].map(([v,l])=>`<button class='btn sr' data-v='${v}'>${l}</button> `).join("")+"</div>":"<button class='btn' id='srsflip'>Umdrehen (Leertaste)</button>")+"</div>";return h;}
function bindSRS(){$$(".sb").forEach(b=>b.onclick=()=>{const id=b.parentNode.dataset.id;const l=D.lessons.find(l=>id.startsWith(l.id+"c"));const c=l.cards[+id.slice(l.id.length+1)];srsRate(D.code+"|"+id,c,b.dataset.v);$$(".sb",b.parentNode).forEach(x=>x.classList.toggle("on",x===b));});
 if(pages[S.page].type!=="srs"){SQ=null;SFLIP=false;return;}
 const f=$("#srsflip");if(f)f.onclick=()=>{SFLIP=true;render();};
 const al=$("#srsall");if(al)al.onclick=()=>{SQ=Object.keys(srsAll()).filter(k=>k.startsWith(D.code+"|"));render();};
 $$(".sr").forEach(b=>b.onclick=()=>{const g=SQ.shift(),o=srsAll(),e=o[g];srsRate(g,[e.f,e.b],b.dataset.v);if(b.dataset.v==="s")SQ.splice(Math.min(2,SQ.length),0,g);SFLIP=false;render();});}
document.addEventListener("keydown",e=>{if(e.key===" "&&$("#srsflip")&&!/TEXTAREA|INPUT/.test(e.target.tagName)){e.preventDefault();$("#srsflip").click();}});
srsRegister();
render();

</script></body></html>
